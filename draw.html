<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>לוח ציור</title>
<link rel="stylesheet" href="theme.css">
<style>
.lp-back-bar{direction:ltr;display:flex;justify-content:flex-start;padding:10px 12px 0}
.lp-back{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 18px 8px 12px;border-radius:999px;background:#fff;color:#5b3fd0;border:2px solid #d9d0fb;box-shadow:0 3px 10px rgba(91,63,208,.18);font:700 1.05rem/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-decoration:none;-webkit-tap-highlight-color:transparent}
.lp-back:active{transform:scale(.97)}
.lp-back-arrow{font-size:1.9rem;line-height:1;font-weight:700}
.lp-back-text{direction:rtl}
</style>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;font-family:Arial,sans-serif;color:#342653;padding:0;background:#fff}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;touch-action:manipulation;cursor:pointer;border:2px solid transparent;border-radius:14px;background:#fff;color:#342653;min-height:46px;min-width:46px;padding:6px 10px;font-weight:bold;box-shadow:0 2px 6px #3426531a}
button:focus-visible{outline:3px solid #8e6bff;outline-offset:2px}
button.on{border-color:#8e6bff;background:#efe7ff;box-shadow:0 0 0 3px #8e6bff55}
.panel{background:#ffffffd9;border-radius:18px;padding:8px;margin:8px 0;box-shadow:0 3px 12px #8e6bff22}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.lbl{font-size:13px;color:#6a5d86;text-align:center;margin:0 0 4px;font-weight:bold}
.colors button{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px #0003}
.colors button.on{box-shadow:0 0 0 4px #342653}
.tool{font-size:15px}
.tool span{font-size:22px;display:block;line-height:1.1}
.shapes button,.stick button{font-size:28px;line-height:1;padding:4px}
.canvaswrap{position:fixed;inset:0;background:#fff;touch-action:none;line-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;direction:rtl;display:flex;gap:6px;align-items:center;justify-content:center;padding:6px 8px;background:linear-gradient(#ffffffef,#ffffffd0);box-shadow:0 2px 10px #8e6bff33;border-radius:0 0 18px 18px}
.topbar .lp-back{min-height:48px;padding:0 14px;font-size:1.6rem;direction:ltr}
.topbar .lp-back-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar .lp-back-arrow{font-size:1.7rem}
.tab{flex:1;max-width:76px;min-height:52px;padding:2px 2px;border-radius:14px;font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:2px solid #e3dafc}
.tab b{font-size:23px;line-height:1.1}
.tab[aria-expanded=true]{border-color:#8e6bff;background:#efe7ff}
.drop{position:fixed;left:8px;right:8px;top:70px;z-index:19;max-height:calc(100dvh - 86px);overflow:auto;direction:rtl;margin:0;background:#fffffff2;box-shadow:0 8px 24px #34265340;border-radius:18px;padding:10px;animation:dd .14s ease-out}
@keyframes dd{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.drop[hidden]{display:none}
.drop .lbl{margin:0 0 6px}
.size{display:flex;align-items:center;gap:8px;justify-content:center}
.size input{width:55%;max-width:260px}
.actions button{background:#fff3c9}
.actions .danger{background:#ffe0e0}
#msg{position:fixed;left:0;right:0;bottom:12px;z-index:15;pointer-events:none;text-align:center;font-size:16px;font-weight:bold;color:#2a7a5a}#msg:empty{display:none}#msg:not(:empty){display:block;width:fit-content;margin:0 auto;max-width:92vw;background:#fffffff0;padding:6px 14px;border-radius:14px;box-shadow:0 2px 8px #3426532a}
.snd{font-size:13px}
</style></head><body>
<h1>לוח ציור</h1>
<div class="canvaswrap"><canvas id="cv" aria-label="משטח ציור"></canvas></div>
<div id="msg" aria-live="polite"></div>
<nav class="topbar" aria-label="כלי ציור">
<a class="lp-back" href="learning.html" aria-label="חזרה לבחירת מקצוע"><span class="lp-back-arrow" aria-hidden="true">←</span><span class="lp-back-text">חזרה לבחירת מקצוע</span></a>
<button class="tab" data-p="p-colors" aria-expanded="false" aria-controls="p-colors"><b aria-hidden="true">🎨</b>צבעים</button>
<button class="tab" data-p="p-tools" aria-expanded="false" aria-controls="p-tools"><b aria-hidden="true">🖌️</b>כלים</button>
<button class="tab" data-p="p-shapes" aria-expanded="false" aria-controls="p-shapes"><b aria-hidden="true">⭐</b>צורות</button>
<button class="tab" data-p="p-stick" aria-expanded="false" aria-controls="p-stick"><b aria-hidden="true">🦄</b>מדבקות</button>
<button class="tab" data-p="p-actions" aria-expanded="false" aria-controls="p-actions"><b aria-hidden="true">⚙️</b>עוד</button>
</nav>
<div class="drop panel" id="p-colors" hidden><p class="lbl">צבעים</p><div class="row colors" id="colors" role="group" aria-label="צבעים"></div></div>
<div class="drop panel" id="p-tools" hidden><p class="lbl">כלים</p><div class="row" id="tools" role="group" aria-label="כלים"></div>
<div class="size" style="margin-top:10px"><span aria-hidden="true">•</span><input id="size" type="range" min="2" max="60" value="12" aria-label="גודל"><span aria-hidden="true" style="font-size:26px">●</span></div></div>
<div class="drop panel" id="p-shapes" hidden><p class="lbl">צורות (לוחצים ואז מציירים על הלוח, הצורה אומרת את שמה)</p><div class="row shapes" id="shapes" role="group" aria-label="צורות"></div></div>
<div class="drop panel" id="p-stick" hidden><p class="lbl">מדבקות</p><div class="row stick" id="stick" role="group" aria-label="מדבקות"></div></div>
<div class="drop panel actions" id="p-actions" hidden><div class="row"><button id="undo">ביטול</button><button id="clear" class="danger">דף חדש</button><button id="save">שמירת תמונה</button><button id="mute" aria-pressed="false">קול</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
let SC=1;
function fit(first){const vv=window.visualViewport,cw=Math.round(vv?vv.width:innerWidth),ch=Math.round(vv?vv.height:innerHeight);SC=Math.min(window.devicePixelRatio||1,2);const w=Math.max(200,Math.round(cw*SC)),h=Math.max(200,Math.round(ch*SC));if(!first&&Math.abs(w-cv.width)<4&&Math.abs(h-cv.height)<4)return;let old=null;if(!first){old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;old.getContext('2d').drawImage(cv,0,0)}cv.width=w;cv.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);if(old)ctx.drawImage(old,0,0);hist.length=0}
const COLORS=['#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#8e24aa','#ec407a','#795548','#222222','#ffffff','#8bc34a'];
const TOOLS=[['brush','','מכחול'],['marker','','טוש עבה'],['rainbow','','קשת'],['spray','','ספריי'],['fill','','מילוי'],['eraser','','מחק']];
const SHAPES=[['circle','⚪','עיגול'],['square','⬜','ריבוע'],['rect','▭','מלבן'],['triangle','🔺','משולש'],['star','⭐','כוכב'],['heart','❤️','לב'],['oval','🥚','אליפסה'],['diamond','🔷','מעוין']];
const STICKERS=[['🐶','כלב'],['🐱','חתול'],['🦋','פרפר'],['🌸','פרח'],['☀️','שמש'],['🌈','קשת'],['🏠','בית'],['🚗','מכונית'],['🎈','בלון'],['🦄','חד קרן'],['🐟','דג'],['🌳','עץ']];
let color=COLORS[5],tool='brush',shapeKind=null,sticker=null,muted=false;
const hist=[];fit(true);let rzT=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(!drawing)fit(false)},250)});
function say(t){if(muted)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function msg(t){$('msg').textContent=t}
function snap(){try{hist.push(ctx.getImageData(0,0,cv.width,cv.height));if(hist.length>25)hist.shift()}catch(e){}}
function white(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)}
white();
function mkBtn(parent,html,label,fn,cls){const b=document.createElement('button');b.innerHTML=html;b.setAttribute('aria-label',label);if(cls)b.className=cls;b.addEventListener('click',fn);parent.appendChild(b);return b}
const colorBtns=COLORS.map(c=>{const b=mkBtn($('colors'),'',c,()=>{color=c;if(tool==='eraser'){setTool('brush')}refresh()});b.style.background=c;b.dataset.c=c;return b});
const toolBtns={};TOOLS.forEach(([k,e,n])=>{toolBtns[k]=mkBtn($('tools'),n,n,()=>{setTool(k);if(k==='fill')msg('לוחצים על אזור כדי לצבוע אותו');else msg('')},'tool')});
const shapeBtns={};SHAPES.forEach(([k,e,n])=>{shapeBtns[k]=mkBtn($('shapes'),'',n,()=>{tool='shape';shapeKind=k;sticker=null;say(n);msg('צורה: '+n+'. מציירים על הלוח (אפשר לגרור כדי לשנות גודל)');refresh()})});
SHAPES.forEach(([k])=>{const c=document.createElement('canvas');c.width=c.height=44;const x=c.getContext('2d');const save=ctx;x.fillStyle='#8e6bff';x.strokeStyle='#342653';x.lineWidth=2;
 const P=(kk,cx,cy,r)=>{x.beginPath();const ct=ctx;};
 shapeIcon(x,k);shapeBtns[k].appendChild(c);});
const stickBtns=STICKERS.map(([e,n])=>mkBtn($('stick'),e,n,()=>{tool='sticker';sticker=[e,n];shapeKind=null;say(n);msg('מדבקה: '+n+'. לוחצים על הלוח');refresh()}));
function setTool(k){tool=k;shapeKind=null;sticker=null;refresh()}
function refresh(){
 colorBtns.forEach(b=>b.classList.toggle('on',b.dataset.c===color));
 Object.entries(toolBtns).forEach(([k,b])=>b.classList.toggle('on',tool===k));
 Object.entries(shapeBtns).forEach(([k,b])=>b.classList.toggle('on',tool==='shape'&&shapeKind===k));
 stickBtns.forEach((b,i)=>b.classList.toggle('on',tool==='sticker'&&sticker&&sticker[0]===STICKERS[i][0]));
}
refresh();
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
function size(){return +$('size').value*SC}
let drawing=false,last=null,start=null,base=null,hue=0,moved=false;
function path(k,x,y,r,r2,c){c=c||ctx;
 c.beginPath();
 switch(k){
 case'circle':c.arc(x,y,r,0,7);break;
 case'square':c.rect(x-r,y-r,2*r,2*r);break;
 case'rect':c.rect(x-r*1.4,y-r*.8,r*2.8,r*1.6);break;
 case'oval':c.ellipse(x,y,r*1.4,r*.85,0,0,7);break;
 case'triangle':c.moveTo(x,y-r);c.lineTo(x+r*1.1,y+r*.8);c.lineTo(x-r*1.1,y+r*.8);c.closePath();break;
 case'diamond':c.moveTo(x,y-r*1.2);c.lineTo(x+r*.9,y);c.lineTo(x,y+r*1.2);c.lineTo(x-r*.9,y);c.closePath();break;
 case'star':for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();break;
 case'heart':c.moveTo(x,y+r*.9);c.bezierCurveTo(x-r*1.4,y+r*.1,x-r*.9,y-r*.95,x,y-r*.35);c.bezierCurveTo(x+r*.9,y-r*.95,x+r*1.4,y+r*.1,x,y+r*.9);c.closePath();break;
 }
}
function shapeIcon(x,k){const sv=ctx;path(k,22,22,15,0,x);x.fillStyle='#8e6bff';x.fill();x.lineWidth=2.5;x.strokeStyle='#342653';x.lineJoin='round';x.stroke()}
function drawShape(k,x,y,r){path(k,x,y,r);ctx.fillStyle=color;ctx.fill();ctx.lineWidth=Math.max(3,r/14);ctx.strokeStyle='#342653';ctx.lineJoin='round';ctx.stroke()}
function drawSticker(x,y,r){ctx.font=`${r*2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(sticker[0],x,y)}
function stroke(a,b){
 ctx.lineCap='round';ctx.lineJoin='round';
 const s=size();
 if(tool==='eraser'){ctx.strokeStyle='#fff';ctx.lineWidth=s*1.6}
 else if(tool==='marker'){ctx.strokeStyle=color;ctx.lineWidth=s*2.2;ctx.globalAlpha=.55}
 else if(tool==='rainbow'){hue=(hue+6)%360;ctx.strokeStyle=`hsl(${hue},90%,55%)`;ctx.lineWidth=s}
 else{ctx.strokeStyle=color;ctx.lineWidth=s}
 if(tool==='spray'){
  ctx.fillStyle=color;
  for(let i=0;i<18;i++){const an=Math.random()*7,d=Math.random()*s*1.8;ctx.fillRect(b.x+Math.cos(an)*d,b.y+Math.sin(an)*d,2.5,2.5)}
 }else{ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 ctx.globalAlpha=1;
}
function floodFill(sx,sy){
 sx=Math.floor(sx);sy=Math.floor(sy);
 const W=cv.width,H=cv.height,img=ctx.getImageData(0,0,W,H),d=img.data;
 const i0=(sy*W+sx)*4,tr=d[i0],tg=d[i0+1],tb=d[i0+2];
 const h=color.replace('#',''),fr=parseInt(h.substr(0,2),16),fg=parseInt(h.substr(2,2),16),fb=parseInt(h.substr(4,2),16);
 if(Math.abs(tr-fr)+Math.abs(tg-fg)+Math.abs(tb-fb)<6)return false;
 const tol=60;
 const match=i=>Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb)<=tol;
 const seen=new Uint8Array(W*H),stack=[sy*W+sx];
 while(stack.length){
  let p=stack.pop();let x=p%W,y=(p/W)|0;
  while(x>=0&&!seen[y*W+x]&&match((y*W+x)*4))x--;
  x++;let up=false,dn=false;
  while(x<W&&!seen[y*W+x]&&match((y*W+x)*4)){
   const q=y*W+x;seen[q]=1;const i=q*4;d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=255;
   if(y>0){const m=!seen[q-W]&&match((q-W)*4);if(m&&!up){stack.push(q-W);up=true}else if(!m)up=false}
   if(y<H-1){const m=!seen[q+W]&&match((q+W)*4);if(m&&!dn){stack.push(q+W);dn=true}else if(!m)dn=false}
   x++;
  }
 }
 /* grow one pixel so soft line edges do not leave a white halo */
 const out=new Uint8ClampedArray(d);
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const q=y*W+x;if(seen[q])continue;
  if(seen[q-1]||seen[q+1]||seen[q-W]||seen[q+W]){const i=q*4;const dark=d[i]+d[i+1]+d[i+2]<300;if(!dark&&match(i)){out[i]=fr;out[i+1]=fg;out[i+2]=fb}}}
 img.data.set(out);ctx.putImageData(img,0,0);return true;
}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
 const p=pos(e);snap();moved=false;
 if(tool==='fill'){if(floodFill(p.x,p.y))say('צבעתי');else hist.pop();return}
 if(tool==='shape'||tool==='sticker'){drawing=true;start=p;base=ctx.getImageData(0,0,cv.width,cv.height);return}
 drawing=true;last=p;stroke(p,{x:p.x+.01,y:p.y})
});
cv.addEventListener('pointermove',e=>{
 if(!drawing)return;e.preventDefault();const p=pos(e);
 if(tool==='shape'||tool==='sticker'){
  moved=true;ctx.putImageData(base,0,0);
  const r=Math.max(20*SC,Math.hypot(p.x-start.x,p.y-start.y));
  tool==='shape'?drawShape(shapeKind,start.x,start.y,r):drawSticker(start.x,start.y,r);return}
 stroke(last,p);last=p
});
function end(e){
 if(!drawing)return;drawing=false;
 if((tool==='shape'||tool==='sticker')&&!moved){
  const r=Math.max(35*SC,size()*3.5);
  tool==='shape'?drawShape(shapeKind,start.x,start.y,r):drawSticker(start.x,start.y,r);
 }
 if(tool==='shape'){const s=SHAPES.find(s=>s[0]===shapeKind);say(s[2])}
 else if(tool==='sticker')say(sticker[1]);
}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
$('undo').onclick=()=>{const h=hist.pop();if(h){ctx.putImageData(h,0,0);msg('')}else msg('אין מה לבטל')};
$('clear').onclick=()=>{if(confirm('להתחיל דף חדש? הציור הנוכחי יימחק.')){snap();white();msg('דף חדש')}};
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇 ללא קול':'קול';this.setAttribute('aria-pressed',muted)};
$('save').onclick=()=>{
 cv.toBlob(b=>{if(!b){msg('לא הצלחתי לשמור');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ציור.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);msg('התמונה נשמרה במכשיר')},'image/png')};
const tabs=[...document.querySelectorAll('.tab')];
function openPanel(id){tabs.forEach(t=>{const on=t.dataset.p===id;t.setAttribute('aria-expanded',on);$(t.dataset.p).hidden=!on})}
tabs.forEach(t=>t.addEventListener('click',()=>{const open=t.getAttribute('aria-expanded')==='true';openPanel(open?'':t.dataset.p)}));
cv.addEventListener('pointerdown',()=>openPanel(''),true);
['colors','shapes','stick'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target.closest('button'))setTimeout(()=>openPanel(''),120)}));
$('tools').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.textContent.trim()==='מילוי')setTimeout(()=>openPanel(''),120)});
$('undo').addEventListener('click',()=>openPanel(''));$('save').addEventListener('click',()=>openPanel(''));
document.addEventListener('keydown',e=>{if(e.key==='Escape')openPanel('')});
document.addEventListener('touchmove',e=>{if(e.target===cv)e.preventDefault()},{passive:false});
</script></body></html>
