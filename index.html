<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>האותיות שלי - לימוד אותיות בעברית</title>
<style>
  :root{--bg1:#fff1d6;--bg2:#dcf5ff;--card:#fff;--pink:#ec4899;--purple:#8b5cf6;--blue:#3b82f6;--green:#22c55e;--amber:#f59e0b;--ink:#3b2f52;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;font-family:"Segoe UI","Heebo","Arial Hebrew",Arial,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);padding:14px;}
  .wrap{max-width:560px;margin:0 auto;}
  header{text-align:center;padding:10px 6px 4px;}
  header h1{font-size:2.2rem;margin:0 0 2px;color:var(--purple);}
  .stars-line{font-size:1.4rem;margin:4px 0;}
  .stage{margin-top:8px;}
  .card{background:var(--card);border-radius:26px;box-shadow:0 8px 24px rgba(139,92,246,.14);padding:22px 16px;margin:0 0 16px;text-align:center;}
  .phase-title{font-size:1.9rem;font-weight:800;color:var(--pink);margin:6px 0 2px;}
  .phase-sub{opacity:.8;margin-bottom:12px;font-size:1.4rem;}
  .big-letter{font-size:13rem;line-height:1.05;font-weight:800;color:var(--purple);margin:4px 0;font-family:"Arial Hebrew","Heebo","Segoe UI",Arial,sans-serif;}
  .letter-name{font-size:2.4rem;font-weight:800;margin:0 0 6px;}
  .prompt-emoji{font-size:6rem;line-height:1.15;margin:6px 0;}
  .example{font-size:1.9rem;color:#6b6390;margin-bottom:12px;}
  .example b{color:var(--pink);font-size:2.3rem;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .opt{border:none;cursor:pointer;font-family:inherit;background:#f6f3ff;border-radius:20px;padding:10px 8px;font-size:1.15rem;font-weight:700;color:var(--ink);min-height:130px;box-shadow:0 3px 0 rgba(139,92,246,.18);transition:transform .1s;}
  .opt:active{transform:scale(.95);}
  .opt.letter{font-size:6.5rem;line-height:1;color:var(--purple);}
  .opt.pic{font-size:4.5rem;line-height:1;}
  .opt.pic small{display:block;font-size:1.5rem;margin-top:4px;color:var(--ink);}
  .opt.wrong{opacity:.35;pointer-events:none;animation:shake .35s;}
  .opt.right{background:#dcfce7;outline:3px solid var(--green);}
  @keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  button.big{border:none;cursor:pointer;font-family:inherit;font-size:1.6rem;font-weight:700;border-radius:999px;padding:16px 28px;min-width:140px;min-height:68px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s;}
  button.big:active{transform:scale(.95);}
  .btn-hear{background:var(--blue);} .btn-ok{background:var(--green);} .btn-next{background:var(--purple);} .btn-warn{background:#9ca3af;}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .feedback{min-height:1.7em;margin-top:12px;font-size:1.8rem;font-weight:700;}
  .feedback.good{color:var(--green);} .feedback.try{color:#d97706;}
  .progress-pips{text-align:center;font-size:1.4rem;letter-spacing:3px;margin-bottom:8px;}
  .done-emoji{font-size:4rem;text-align:center;}
  .confetti{position:fixed;pointer-events:none;font-size:1.6rem;z-index:50;animation:fall 1.4s ease-in forwards;}
  @keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(70vh) rotate(320deg);opacity:0;}}
  footer{margin-top:22px;text-align:center;}
  details{background:var(--card);border-radius:18px;padding:12px 16px;text-align:right;box-shadow:0 4px 14px rgba(139,92,246,.10);margin-top:10px;}
  summary{cursor:pointer;font-weight:700;color:var(--purple);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center;}
  .chip{background:#f6f3ff;border-radius:14px;padding:6px 14px;font-size:2.6rem;font-weight:800;color:var(--purple);}
  .chip.locked{opacity:.25;}
  #visits{text-align:center;margin:18px 0 8px;} #visits img{height:22px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="greet">🌟 האותיות שלי 🌟</h1>
    <div class="stars-line" id="starsLine"></div>
  </header>
  <main class="stage" id="stage"></main>
  <footer>
    <details id="lettersDetails" class="hidden">
      <summary>🔤 האותיות שלי</summary>
      <div class="chips" id="allLetters"></div>
    </details>
    <details id="parentDetails" class="hidden">
      <summary>👨‍👩‍👧 להורים</summary>
      <div class="phase-sub" style="margin-top:8px">כל יום מתווספות 2 אותיות חדשות. אפשר גם להוסיף ידנית או להתחיל מחדש. ההתקדמות נשמרת בדפדפן הזה בלבד.</div>
      <div class="btn-row">
        <button class="big btn-ok" id="addOne">➕ עוד אות</button>
        <button class="big btn-warn" id="resetKid">🔄 התחלה מחדש</button>
      </div>
    </details>
  </footer>
  <div id="visits"><img src="https://visitor-badge.laobi.icu/badge?page_id=miromiro1515.hebrew-letters&left_text=%D7%91%D7%99%D7%A7%D7%95%D7%A8%D7%99%D7%9D" alt="" onerror="this.parentNode.style.display='none'"></div>
</div>

<script>
"use strict";
/* [letter, name, example word, emoji, kind]  kind: "" starts-with, "end" ends-with */
const LETTERS = [
["א","אלף","אריה","🦁",""],["ב","בית","בלון","🎈",""],["ג","גימל","גלידה","🍦",""],["ד","דלת","דג","🐟",""],
["ה","הא","הר","⛰️",""],["ו","וו","ורד","🌹",""],["ז","זין","זברה","🦓",""],["ח","חית","חתול","🐱",""],
["ט","טית","טיל","🚀",""],["י","יוד","ילד","👦",""],["כ","כף","כדור","⚽",""],["ל","למד","לב","❤️",""],
["מ","מם","מטוס","✈️",""],["נ","נון","נחש","🐍",""],["ס","סמך","סוס","🐴",""],["ע","עין","עץ","🌳",""],
["פ","פא","פיל","🐘",""],["צ","צדי","צב","🐢",""],["ק","קוף","קוף","🐵",""],["ר","ריש","רכבת","🚆",""],
["ש","שין","שמש","☀️",""],["ת","תו","תפוח","🍎",""],
["ך","כף סופית","מלך","👑","end"],["ם","מם סופית","ים","🌊","end"],["ן","נון סופית","גן","🌷","end"],
["ף","פא סופית","כף","🥄","end"],["ץ","צדי סופית","עץ","🌳","end"]
];
const LETTER_SOUNDS=["אַ","בַּ","גְּ","דָּ","הַ","וֶ","זֶ","חַ","טִ","יֶ","כַּ","לֵ","מַ","נָ","סוּ","עֵ","פִ","צַ","קוֹ","רַ","שֶׁ","תַּ","כְ","מִ","נִ","פְ","צְ"];
const STARTER_COUNT=4, NEW_PER_DAY=2, WARM_Q=4, FINAL_OLD_Q=3;
const KEY="hebrewLettersV1";
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function loadAll(){try{return JSON.parse(localStorage.getItem(KEY))||{profiles:{},current:null};}catch(e){return {profiles:{},current:null};}}
function saveAll(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
let DB=loadAll();
function rangeArr(a,b){const r=[];for(let i=a;i<b;i++)r.push(i);return r;}
function newProfile(){return {name:"",learned:STARTER_COUNT,day:todayStr(),stars:0,session:{phase:"learn"},introducedToday:rangeArr(0,STARTER_COUNT)};}
function rollover(p){
  if(p.day!==todayStr()){
    const before=p.learned;
    p.learned=Math.min(p.learned+NEW_PER_DAY,LETTERS.length);
    p.day=todayStr();
    p.introducedToday=rangeArr(before,p.learned);
    p.session={phase:p.introducedToday.length?"warm":"warm"};
    saveAll();
  }
}

/* ===== Speech (Hebrew TTS) ===== */
function say(text,onend){
  if(!("speechSynthesis" in window)){if(onend)onend();return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="he-IL";u.rate=0.8;
  const vs=window.speechSynthesis.getVoices();
  const v=vs.find(v=>v.lang==="he-IL"||v.lang==="he_IL")||vs.find(v=>v.lang.startsWith("he"));
  if(v)u.voice=v;
  if(onend){
    let fired=false;const fin=()=>{if(fired)return;fired=true;onend();};
    u.onend=fin;u.onerror=fin;
    const t0=Date.now();
    const poll=setInterval(()=>{if(fired||(!window.speechSynthesis.speaking&&!window.speechSynthesis.pending&&Date.now()-t0>600)||Date.now()-t0>7000){clearInterval(poll);fin();}},250);
  }
  window.speechSynthesis.speak(u);
}
if("speechSynthesis" in window)window.speechSynthesis.getVoices();
function letterCue(i){return "האות "+LETTER_SOUNDS[i];}
function sayLetter(i){say(letterCue(i));}
function sayLetterAndWord(i,cb){const L=LETTERS[i];say(letterCue(i),()=>say(L[4]==="end"?"בסוף המילה "+L[2]:"בתחילת המילה "+L[2],cb));}

const PRAISE=["כל הכבוד! 🌟","מדהים! 🎉","וואו, נהדר! ⭐","בדיוק ככה! 💪","את אלופה! 🏆","מושלם! 🌈","יש! עוד כוכב! ✨"];
const TRY_AGAIN=["כמעט! נסי שוב 💪","עוד פעם, את יכולה! 🌸","לא נורא, ננסה שוב 😊"];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
const tryMsg=()=>TRY_AGAIN[Math.floor(Math.random()*TRY_AGAIN.length)];
function confetti(){const e=["🎉","⭐","🌟","🎈","🌈","💖"];for(let i=0;i<18;i++){const s=document.createElement("span");s.className="confetti";s.textContent=e[Math.floor(Math.random()*e.length)];s.style.left=Math.random()*100+"vw";s.style.top="-20px";s.style.animationDelay=(Math.random()*0.5)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2200);}}

const stage=document.getElementById("stage");
function el(tag,cls,html){const d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function currentProfile(){return DB.current?DB.profiles[DB.current]:null;}

function renderHeader(){
  const p=currentProfile();
  document.getElementById("greet").textContent="🌟 האותיות שלי 🌟";
  document.getElementById("starsLine").textContent=p?"⭐ "+p.stars+" כוכבים · "+p.learned+" אותיות":"";
  ["lettersDetails","parentDetails"].forEach(id=>document.getElementById(id).classList.toggle("hidden",!p));
  const box=document.getElementById("allLetters");box.innerHTML="";
  if(p)LETTERS.forEach((L,i)=>{const c=el("span","chip"+(i<p.learned?"":" locked"),L[0]);if(i<p.learned)c.onclick=()=>sayLetter(i);box.appendChild(c);});
}

function startSession(){
  const p=currentProfile();if(!p){DB.current="child";DB.profiles[DB.current]=newProfile();saveAll();startSession();return;}
  rollover(p);renderHeader();
  const ph=p.session.phase;
  if(ph==="warm")runWarmup(p);else if(ph==="learn")runLearn(p,0);else if(ph==="final")runFinal(p);else showDone(p);
}
function setPhase(p,ph){p.session.phase=ph;saveAll();}

function runWarmup(p){
  const older=rangeArr(0,p.learned).filter(i=>!p.introducedToday.includes(i));
  const pool=older.length?older:[];
  const qs=shuffle(pool.slice()).slice(0,Math.min(WARM_Q,pool.length));
  const after=()=>{if(p.introducedToday.length){setPhase(p,"learn");runLearn(p,0);}else{setPhase(p,"final");runFinal(p);}};
  if(!qs.length){after();return;}
  quizFlow(p,qs,{title:"🔁 חזרה קטנה",sub:"קודם נזכר באותיות שכבר למדנו",onDone:after});
}

function runLearn(p,k){
  const ids=p.introducedToday;
  if(k>=ids.length){setPhase(p,"final");runFinal(p);return;}
  const i=ids[k],L=LETTERS[i];
  stage.innerHTML="";
  const c=el("div","card");
  c.appendChild(el("div","progress-pips",ids.map((_,j)=>j<k?"🟣":(j===k?"🟡":"⚪")).join(" ")));
  c.appendChild(el("div","phase-title","🌷 בואי נכיר ("+(k+1)+"/"+ids.length+")"));
  c.appendChild(el("div","big-letter",L[0]));
  c.appendChild(el("div","letter-name",L[1]));
  c.appendChild(el("div","prompt-emoji",L[3]));
  c.appendChild(el("div","example",(L[4]==="end"?"בסוף המילה ":"כמו ב")+"<b>"+L[2]+"</b>"));
  const row=el("div","btn-row");
  const hear=el("button","big btn-hear","🔊 שמעי");hear.onclick=()=>sayLetterAndWord(i);row.appendChild(hear);
  const nx=el("button","big btn-next",k+1<ids.length?"הבאה ⬅️":"לחזרה! 🎯");
  nx.onclick=()=>{p.stars++;saveAll();renderHeader();runLearn(p,k+1);};
  row.appendChild(nx);c.appendChild(row);
  stage.appendChild(c);
  sayLetterAndWord(i);
}

function runFinal(p){
  const fresh=p.introducedToday.slice();
  const older=rangeArr(0,p.learned).filter(i=>!fresh.includes(i));
  const oldPick=shuffle(older.slice()).slice(0,Math.min(FINAL_OLD_Q,older.length));
  const qs=shuffle(fresh.concat(oldPick));
  if(!qs.length){showDone(p);return;}
  quizFlow(p,qs,{title:"🎯 בואי נבדוק",sub:"אותיות חדשות וישנות ביחד!",onDone:()=>{setPhase(p,"done");showDone(p);}});
}

function showDone(p){
  stage.innerHTML="";renderHeader();
  const c=el("div","card");
  c.appendChild(el("div","done-emoji","🏆"));
  c.appendChild(el("div","phase-title","כל הכבוד!"));
  c.appendChild(el("div","phase-sub","סיימת את התרגול של היום. מחר יחכו לך אותיות חדשות! 🌈"));
  const row=el("div","btn-row");const free=el("button","big btn-hear","🎲 תרגול חופשי");
  free.onclick=()=>{const ids=shuffle(rangeArr(0,p.learned)).slice(0,Math.min(8,p.learned));quizFlow(p,ids,{title:"🎲 תרגול חופשי",sub:"סתם בשביל הכיף",onDone:()=>showDone(p)});};
  row.appendChild(free);c.appendChild(row);stage.appendChild(c);confetti();
}

/* ===== Quiz: three question kinds ===== */
function quizFlow(p,items,opts){
  let qi=0,mistakes=0;
  function pool(excl){return shuffle(rangeArr(0,p.learned).filter(x=>x!==excl));}
  function distract(i,n){
    const L=LETTERS[i];
    const all=pool(i).filter(x=>LETTERS[x][0]!==L[0]);
    return all.slice(0,n);
  }
  function next(){
    if(qi>=items.length){opts.onDone();return;}
    const i=items[qi],L=LETTERS[i];
    const kind=["find","pic","match"][Math.floor(Math.random()*3)];
    const ds=distract(i,3);
    /* with very few letters learned, fall back to 2-3 options */
    stage.innerHTML="";
    const c=el("div","card");
    c.appendChild(el("div","progress-pips",items.map((_,j)=>j<qi?"🟣":(j===qi?"🟡":"⚪")).join(" ")));
    c.appendChild(el("div","phase-title",opts.title));
    c.appendChild(el("div","phase-sub",opts.sub));
    let promptSay;
    if(kind==="find"){
      c.appendChild(el("div","letter-name","איפה האות "+L[1]+"?"));
      promptSay=()=>say("איפה הצליל של "+letterCue(i)+"?");
    }else if(kind==="pic"){
      c.appendChild(el("div","prompt-emoji",L[3]));
      c.appendChild(el("div","letter-name",L[4]==="end"?"באיזו אות נגמרת המילה "+L[2]+"?":"באיזו אות מתחילה המילה "+L[2]+"?"));
      promptSay=()=>say(L[4]==="end"?"באיזו אות נגמרת המילה "+L[2]+"?":"באיזו אות מתחילה המילה "+L[2]+"?");
    }else{
      c.appendChild(el("div","big-letter",L[0]));
      c.appendChild(el("div","letter-name",L[1]));
      c.appendChild(el("div","phase-sub",L[4]==="end"?"איזו מילה נגמרת באות הזאת?":"איזו מילה מתחילה באות הזאת?"));
      promptSay=()=>say(letterCue(i)+". "+(L[4]==="end"?"איזו מילה נגמרת באות הזאת?":"איזו מילה מתחילה באות הזאת?"));
    }
    const grid=el("div","opts");
    const choices=shuffle([i].concat(ds));
    let answered=false;
    choices.forEach(ci=>{
      const M=LETTERS[ci];
      const b=el("button","opt "+(kind==="match"?"pic":"letter"),kind==="match"?M[3]+"<small>"+M[2]+"</small>":M[0]);
      b.onclick=()=>{
        if(answered)return;
        if(ci===i){
          answered=true;b.classList.add("right");fb.textContent=praise();fb.className="feedback good";confetti();
          if(mistakes===0||true){p.stars++;saveAll();renderHeader();}
          say(letterCue(i)+(kind==="match"?". "+L[2]:""),()=>{setTimeout(()=>{qi++;mistakes=0;next();},300);});
        }else{
          mistakes++;b.classList.add("wrong");fb.textContent=tryMsg();fb.className="feedback try";
          say(kind==="match"?M[2]:letterCue(ci));
        }
      };
      grid.appendChild(b);
    });
    c.appendChild(grid);
    const fb=el("div","feedback");c.appendChild(fb);
    const row=el("div","btn-row");const h=el("button","big btn-hear","🔊 שמעי שוב");h.onclick=promptSay;row.appendChild(h);c.appendChild(row);
    stage.appendChild(c);
    promptSay();
  }
  next();
}

document.getElementById("addOne").onclick=()=>{
  const p=currentProfile();if(!p)return;
  if(p.learned>=LETTERS.length){alert("כל האותיות כבר נלמדו 🎉");return;}
  p.introducedToday=[p.learned];p.learned++;p.session={phase:"learn"};saveAll();startSession();
};
document.getElementById("resetKid").onclick=()=>{
  const p=currentProfile();if(!p)return;
  if(confirm("להתחיל מחדש?")){DB.profiles[DB.current]=newProfile();saveAll();startSession();}
};

if(!DB.current||!DB.profiles[DB.current]){
 const saved=Object.keys(DB.profiles);
 DB.current=saved[0]||"child";
 if(!DB.profiles[DB.current])DB.profiles[DB.current]=newProfile();
 saveAll();
}
startSession();
</script>
</body>
</html>
