<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>האותיות שלי - לימוד אותיות בעברית</title>
<style>
:root{--bg1:#fff1d6;--bg2:#dcf5ff;--card:#fff;--pink:#ec4899;--purple:#8b5cf6;--blue:#3b82f6;--green:#22c55e;--amber:#f59e0b;--ink:#3b2f52;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;min-height:100vh;font-family:"Segoe UI","Heebo","Arial Hebrew",Arial,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);padding:14px;}
.wrap{max-width:560px;margin:0 auto;}
header{text-align:center;padding:10px 6px 4px;}
header h1{font-size:2.2rem;margin:0 0 2px;color:var(--purple);}
.stars-line{font-size:1.4rem;margin:4px 0;}
.stage{margin-top:8px;}
.card{background:var(--card);border-radius:26px;box-shadow:0 8px 24px rgba(139,92,246,.14);padding:22px 16px;margin:0 0 16px;text-align:center;}
.phase-title{font-size:1.9rem;font-weight:800;color:var(--pink);margin:6px 0 2px;}
.phase-sub{opacity:.8;margin-bottom:12px;font-size:1.4rem;}
.big-letter{font-size:13rem;line-height:1.05;font-weight:800;color:var(--purple);margin:4px 0;font-family:"Arial Hebrew","Heebo","Segoe UI",Arial,sans-serif;}
.letter-name{font-size:2.4rem;font-weight:800;margin:0 0 6px;}
.prompt-emoji{font-size:6rem;line-height:1.15;margin:6px 0;}
.example{font-size:1.9rem;color:#6b6390;margin-bottom:12px;}
.example b{color:var(--pink);font-size:2.3rem;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.opt{border:none;cursor:pointer;font-family:inherit;background:#f6f3ff;border-radius:20px;padding:10px 8px;font-size:1.15rem;font-weight:700;color:var(--ink);min-height:130px;box-shadow:0 3px 0 rgba(139,92,246,.18);transition:transform .1s;}
.opt:active{transform:scale(.95);}
.opt.letter{font-size:6.5rem;line-height:1;color:var(--purple);}
.opt.pic{font-size:4.5rem;line-height:1;}
.opt.pic small{display:block;font-size:1.5rem;margin-top:4px;color:var(--ink);}
.opt.wrong{opacity:.35;pointer-events:none;animation:shake .35s;}
.opt.right{background:#dcfce7;outline:3px solid var(--green);}
@keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
button.big{border:none;cursor:pointer;font-family:inherit;font-size:1.6rem;font-weight:700;border-radius:999px;padding:16px 28px;min-width:140px;min-height:68px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s;}
button.big:active{transform:scale(.95);}
.btn-hear{background:var(--blue);} .btn-ok{background:var(--green);} .btn-next{background:var(--purple);} .btn-warn{background:#9ca3af;}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.feedback{min-height:1.7em;margin-top:12px;font-size:1.8rem;font-weight:700;}
.feedback.good{color:var(--green);} .feedback.try{color:#d97706;}
.progress-pips{text-align:center;font-size:1.4rem;letter-spacing:3px;margin-bottom:8px;}
.done-emoji{font-size:4rem;text-align:center;}
.confetti{position:fixed;pointer-events:none;font-size:1.6rem;z-index:50;animation:fall 1.4s ease-in forwards;}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(70vh) rotate(320deg);opacity:0;}}
.modebar{display:flex;gap:10px;justify-content:center;margin:8px 0 4px;}
.modebtn{border:none;cursor:pointer;font-family:inherit;font-size:1.5rem;font-weight:800;border-radius:999px;padding:10px 22px;min-height:56px;background:#efe9ff;color:var(--purple);box-shadow:0 3px 0 rgba(139,92,246,.18);}
.modebtn.active{background:var(--purple);color:#fff;}
.tiles{display:flex;gap:8px;justify-content:center;margin:12px 0;}
.tile{width:64px;height:80px;border-radius:16px;background:#f6f3ff;display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:800;color:var(--purple);box-shadow:0 3px 0 rgba(139,92,246,.18);}
.tile.hidden-l{color:#cfc8ea;}
.built-word{font-size:5.5rem;font-weight:800;color:var(--purple);margin:6px 0;}
footer{margin-top:22px;text-align:center;}
details{background:var(--card);border-radius:18px;padding:12px 16px;text-align:right;box-shadow:0 4px 14px rgba(139,92,246,.10);margin-top:10px;}
summary{cursor:pointer;font-weight:700;color:var(--purple);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center;}
.chip{background:#f6f3ff;border-radius:14px;padding:6px 14px;font-size:2.6rem;font-weight:800;color:var(--purple);}
.chip.locked{opacity:.25;}
#visits{text-align:center;margin:18px 0 8px;} #visits img{height:22px;}
.difficulty{margin:10px 0;text-align:center;}
.difficulty-controls{display:flex;justify-content:center;gap:10px;margin:8px 0;}
.difficulty-controls button{border:0;border-radius:18px;padding:12px 18px;min-height:48px;background:#efe9ff;color:#6340a2;font:700 1.15rem Arial;cursor:pointer;}
.difficulty-controls button:disabled{opacity:.38;cursor:default;}
.difficulty-label{font-size:1.2rem;font-weight:bold;}
.puzzle-reference{font:bold 3rem Arial;color:#8b5cf6;line-height:1.15;}
.puzzle-cell.no-guide:not(.placed) img{opacity:0;}
.puzzle-dense .puzzle-pieces{width:min(240px,100%);gap:8px;}
.puzzle-dense .puzzle-board{width:min(264px,100%);}
.hidden{display:none;}
.modebar{flex-wrap:wrap;gap:6px;}
.modebtn{font-size:1.15rem;padding:10px 14px;}
.puzzle-card{padding:16px 12px;}
.puzzle-card .phase-title{font-size:1.65rem;}
.puzzle-hint{font-size:1.2rem;margin:8px 0 12px;}
.puzzle-board,.puzzle-pieces{direction:ltr;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;width:min(240px,100%);margin:12px auto;}
.puzzle-board{background:#ede7fc;padding:4px;border-radius:16px;}
.puzzle-cell,.puzzle-piece{aspect-ratio:1;border:2px dashed #c4b5e5;border-radius:10px;background:#faf8ff;padding:0;overflow:hidden;cursor:pointer;min-width:0;touch-action:manipulation;}
.puzzle-cell img,.puzzle-piece img{width:100%;height:100%;display:block;pointer-events:none;}
.puzzle-cell:not(.placed) img{opacity:.17;}
.puzzle-cell.placed{border:2px solid #86d6b2;background:#fff;}
.puzzle-pieces{width:min(220px,100%);gap:10px;}
.puzzle-piece{border:3px solid #d9cdf6;background:white;box-shadow:0 3px 0 #d9cdf6;}
.puzzle-piece.selected{border-color:#8b5cf6;background:#f1eaff;outline:3px solid #e8dfff;}
.puzzle-piece:disabled{visibility:hidden;}
.puzzle-piece{touch-action:none;}
.puzzle-cell.drop-hint{border-color:#8b5cf6;box-shadow:0 0 0 3px #e8dfff;}
.puzzle-ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;border:3px solid #8b5cf6;border-radius:10px;box-shadow:0 8px 18px rgba(60,40,120,.35);background:#fff;padding:0;overflow:hidden;}
.puzzle-ghost img{width:100%;height:100%;display:block;}
.puzzle-progress{font-size:1.15rem;color:#6b6390;}
.puzzle-card .feedback{font-size:1.25rem;margin-top:6px;}
.maze-word{font:bold 2rem Arial;color:#3c2a63;margin:2px 0 4px;letter-spacing:1px;}
.maze-wrap{width:min(340px,100%);margin:6px auto;}
.maze-canvas{display:block;width:100%;height:auto;border-radius:12px;touch-action:none;box-shadow:0 3px 0 rgba(139,92,246,.18);}
.lp-back-bar{direction:ltr;display:flex;justify-content:flex-start;padding:10px 12px 0}
.lp-back{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 18px 8px 12px;border-radius:999px;background:#fff;color:#5b3fd0;border:2px solid #d9d0fb;box-shadow:0 3px 10px rgba(91,63,208,.18);font:700 1.05rem/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-decoration:none;-webkit-tap-highlight-color:transparent}
.lp-back:active{transform:scale(.97)}
.lp-back-arrow{font-size:1.9rem;line-height:1;font-weight:700}
.lp-back-text{direction:rtl}
.puzzle-reward{display:block;width:190px;max-width:80%;height:210px;object-fit:cover;border-radius:24px;margin:14px auto;}
.puzzle-card button:focus-visible{outline:4px solid #f59e0b;outline-offset:2px;}
@media(max-width:600px){
body{padding:8px;}
header{padding:4px 4px 0;}header h1{font-size:1.6rem;}
.stars-line{font-size:1rem;margin:3px 0;}
.modebar{margin:6px 0;gap:6px;}.modebtn{min-height:44px;font-size:.95rem;padding:8px 10px;}
.difficulty{margin:6px 0;}.difficulty-label{font-size:1rem;}.difficulty-controls{margin:6px 0;gap:8px;}
.difficulty-controls button{min-height:44px;padding:8px 16px;font-size:1rem;}
.card{padding:12px;margin-bottom:10px;border-radius:22px;}
.phase-title{font-size:1.4rem;margin:4px 0;}.phase-sub{font-size:1.05rem;margin-bottom:6px;}
.big-letter{font-size:7rem;}.letter-name{font-size:1.55rem;margin-bottom:4px;}
.prompt-emoji{font-size:3.5rem;margin:4px 0;}.example{font-size:1.2rem;margin-bottom:6px;}.example b{font-size:1.45rem;}
.opts{gap:8px;margin-top:8px;}.opt{min-height:82px;padding:6px;}.opt.letter{font-size:4rem;}.opt.pic{font-size:3rem;}.opt.pic small{font-size:1.1rem;}
button.big{min-height:48px;min-width:110px;padding:10px 18px;font-size:1.1rem;}.btn-row{gap:8px;margin-top:8px;}
.feedback{font-size:1.25rem;margin-top:6px;}.progress-pips{font-size:1rem;margin-bottom:4px;}
.tiles{gap:6px;margin:8px 0;}.tile{width:42px;height:54px;border-radius:12px;font-size:2.2rem;}
.built-word{font-size:3.4rem;}.done-emoji{font-size:3rem;}
.puzzle-card{padding:12px 10px;}.puzzle-card .phase-title{font-size:1.4rem;}.puzzle-hint{font-size:1rem;margin:6px 0;}
.puzzle-board,.puzzle-dense .puzzle-board{width:190px;margin:8px auto;gap:3px;padding:3px;}
.puzzle-pieces,.puzzle-dense .puzzle-pieces{width:180px;margin:8px auto;gap:7px;}
.puzzle-progress{font-size:1rem;}.puzzle-card .feedback{font-size:1rem;}
.puzzle-reference{font-size:2.3rem;}.puzzle-reward{width:140px;height:145px;margin:10px auto;}
footer{margin-top:12px;}details{padding:10px 12px;}#visits{margin-top:10px;}
}
</style>
</head>

<div class="wrap">

<button class="modebtn" id="modeMaze">מבוך</button>
</div>
<section class="difficulty hidden" id="difficultyBar" aria-label="רמת המשחק">
<div class="difficulty-label" id="difficultyLabel"></div>

<main class="stage" id="stage"></main>
<footer>
<details id="lettersDetails" class="hidden">
<summary>האותיות שלי</summary>
<div class="chips" id="allLetters"></div>
</details>
<details id="parentDetails" class="hidden">
<summary>להורים</summary>
<div class="phase-sub" style="margin-top:8px">כל יום מתווספות 2 אותיות חדשות. אפשר גם להוסיף ידנית או להתחיל מחדש. ההתקדמות נשמרת בדפדפן הזה בלבד.</div>
<div class="btn-row">
<button class="big btn-ok" id="addOne">➕ עוד אות</button>
<button class="big btn-warn" id="resetKid">🔄 התחלה מחדש</button>
</div>
</details>
<small style="display:block;font-size:10px;margin-top:10px;color:#6b6390">Word pictures: Twemoji, CC-BY 4.0, Twitter and contributors.</small>

function wordPicture(w){const img=document.createElement("img");img.src=WORD_PICTURES[WORDS[w][1]];img.alt="";img.style.cssText="width:1em;height:1em;display:inline-block";return img;}
const CHAR_IDX={};LETTERS.forEach((L,i)=>{CHAR_IDX[L[0]]=i;});
let wordMode=false,puzzleMode=false,mazeMode=false,lastWord=-1,viewId=0;
function guardedTransition(fn,ms){const id=viewId;setTimeout(()=>{if(id===viewId)fn();},ms);}
const STARTER_COUNT=4, NEW_PER_DAY=2, WARM_Q=4, FINAL_OLD_Q=3;
const KEY="hebrewLettersV1";
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function loadAll(){try{return JSON.parse(localStorage.getItem(KEY))||{profiles:{},current:null};}catch(e){return {profiles:{},current:null};}}
function saveAll(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
let DB=loadAll();
function rangeArr(a,b){const r=[];for(let i=a;i<b;i++)r.push(i);return r;}
function newProfile(){return {name:"",learned:STARTER_COUNT,day:todayStr(),stars:0,session:{phase:"learn"},introducedToday:rangeArr(0,STARTER_COUNT)};}
function rollover(p){
if(p.day!==todayStr()){
const before=p.learned;
p.learned=Math.min(p.learned+NEW_PER_DAY,LETTERS.length);
p.day=todayStr();
p.introducedToday=rangeArr(before,p.learned);
p.session={phase:p.introducedToday.length?"warm":"warm"};
saveAll();
}
}

let narrationId=0,activeCue=null;
function stopNarration(){
narrationId++;
if(activeCue){activeCue.onended=null;activeCue.onerror=null;activeCue.pause();activeCue=null;}
if("speechSynthesis" in window)window.speechSynthesis.cancel();
return narrationId;
}
function speakText(text,onend,id){
if(id!==narrationId)return;
if(!text||!("speechSynthesis" in window)){if(onend)onend();return;}
const u=new SpeechSynthesisUtterance(text);
u.lang="he-IL";u.rate=0.8;
const vs=window.speechSynthesis.getVoices();
const v=vs.find(v=>v.lang==="he-IL"||v.lang==="he_IL")||vs.find(v=>v.lang.startsWith("he"));
if(v)u.voice=v;
let fired=false;
const fin=()=>{if(fired)return;fired=true;if(id===narrationId&&onend)onend();};
u.onend=fin;u.onerror=fin;
if(onend){const t0=Date.now();const poll=setInterval(()=>{if(fired||id!==narrationId){clearInterval(poll);return;}if((!window.speechSynthesis.speaking&&!window.speechSynthesis.pending&&Date.now()-t0>600)||Date.now()-t0>9000){clearInterval(poll);fin();}},250);}
window.speechSynthesis.speak(u);
}
function say(text,onend){const id=stopNarration();speakText(text,onend,id);}
if("speechSynthesis" in window)window.speechSynthesis.getVoices();
function letterCue(i){return "האות "+CUE_FALLBACK[i];}
function sayLetterWithText(i,text="",onend){
const id=stopNarration();
const a=new Audio("data:audio/mpeg;base64,"+CUE_AUDIO[i]);activeCue=a;
let finished=false;
const finish=()=>{if(finished||id!==narrationId)return;finished=true;activeCue=null;speakText(text,onend,id);};
const fallback=()=>{if(finished||id!==narrationId)return;finished=true;activeCue=null;speakText(letterCue(i)+(text?". "+text:""),onend,id);};
a.onended=finish;a.onerror=fallback;
a.play().catch(e=>{
if(id!==narrationId||finished)return;
if(e.name==="NotAllowedError"){
finished=true;activeCue=null;
const hear=document.querySelector(".btn-hear");if(hear)hear.textContent="🔊 לחצי לשמיעה";
return;
}
fallback();
});
}
function sayLetter(i){sayLetterWithText(i);}
function learnExamples(i){const L=LETTERS[i];return [[L[2],L[3]],...(EXTRA_EXAMPLES[L[0]]||[])];}
function sayLetterAndWord(i,cb){const L=LETTERS[i],where=L[4]==="end"?"בסוף המילה ":"בתחילת המילה ";sayLetterWithText(i,where+L[2],cb);}
function sayLearnExample(i,word,cb){const L=LETTERS[i],where=L[4]==="end"?"בסוף המילה ":"כמו ב";sayLetterWithText(i,where+word,cb);}
function sayWord(w,onend){
const id=stopNarration();
if(typeof WORD_AUDIO==="undefined"||!WORD_AUDIO[w]){speakText(WORDS[w][0],onend,id);return;}
const a=new Audio("data:audio/mpeg;base64,"+WORD_AUDIO[w]);activeCue=a;
let finished=false;
const fallback=()=>{if(finished||id!==narrationId)return;finished=true;activeCue=null;speakText(WORDS[w][0],onend,id);};
const finish=()=>{if(finished||id!==narrationId)return;finished=true;activeCue=null;if(onend)onend();};
a.onended=finish;a.onerror=fallback;
a.play().catch(e=>{
if(id!==narrationId||finished)return;
if(e.name==="NotAllowedError"){
finished=true;activeCue=null;
const hear=document.querySelector(".btn-hear");if(hear)hear.textContent="🔊 לחצי לשמיעה";
return;
}
fallback();
});
}

document.getElementById("starsLine").textContent=p?"★ "+p.stars+" כוכבים · "+p.learned+" אותיות":"";

document.getElementById("modebar").classList.toggle("hidden",!p);

function startSession(){
viewId++;puzzleMode=false;wordMode=false;mazeMode=false;stopNarration();
const p=currentProfile();if(!p){DB.current="child";DB.profiles[DB.current]=newProfile();saveAll();startSession();return;}
rollover(p);renderHeader();
const ph=p.session.phase;
if(ph==="warm")runWarmup(p);else if(ph==="learn")runLearn(p,0);else if(ph==="final")runFinal(p);else showDone(p);
}
function setPhase(p,ph){p.session.phase=ph;saveAll();}
function runWarmup(p){
const older=rangeArr(0,p.learned).filter(i=>!p.introducedToday.includes(i));
const pool=older.length?older:[];
const qs=shuffle(pool.slice()).slice(0,Math.min(WARM_Q,pool.length));
const after=()=>{if(p.introducedToday.length){setPhase(p,"learn");runLearn(p,0);}else{setPhase(p,"final");runFinal(p);}};
if(!qs.length){after();return;}
quizFlow(p,qs,{title:"🔁 חזרה קטנה",sub:"קודם נזכר באותיות שכבר למדנו",onDone:after});
}
function runLearn(p,k,j=0){
stopNarration();
const ids=p.introducedToday;
if(k>=ids.length){setPhase(p,"final");runFinal(p);return;}
const i=ids[k],L=LETTERS[i],examples=learnExamples(i),example=examples[j];
stage.innerHTML="";
const c=el("div","card");
c.appendChild(el("div","progress-pips",ids.map((_,j)=>j<k?"🟣":(j===k?"🟡":"⚪")).join(" ")));
c.appendChild(el("div","phase-title","🌷 בואי נכיר ("+(k+1)+"/"+ids.length+")"));
c.appendChild(el("div","big-letter",L[0]));
c.appendChild(el("div","letter-name",L[1]));
c.appendChild(el("div","prompt-emoji",example[1]));
c.appendChild(el("div","example",(L[4]==="end"?"בסוף המילה ":"כמו ב")+"<b>"+example[0]+"</b>"));
c.appendChild(el("div","phase-sub","דוגמה "+(j+1)+" מתוך "+examples.length));
const row=el("div","btn-row");
const hear=el("button","big btn-hear","🔊 שמעי שוב");hear.onclick=()=>sayLearnExample(i,example[0]);row.appendChild(hear);
const nextLabel=j+1<examples.length?"עוד מילה":k+1<ids.length?"הבאה ⬅️":"לחזרה! 🎯";
const nx=el("button","big btn-next",nextLabel);
nx.onclick=()=>{if(j+1<examples.length){runLearn(p,k,j+1);return;}p.stars++;saveAll();renderHeader();runLearn(p,k+1,0);};
row.appendChild(nx);c.appendChild(row);
stage.appendChild(c);
sayLearnExample(i,example[0]);
}
function runFinal(p){
const fresh=p.introducedToday.slice();
const older=rangeArr(0,p.learned).filter(i=>!fresh.includes(i));
const oldPick=shuffle(older.slice()).slice(0,Math.min(FINAL_OLD_Q,older.length));
const qs=shuffle(fresh.concat(oldPick));
if(!qs.length){showDone(p);return;}
quizFlow(p,qs,{title:"🎯 בואי נבדוק",sub:"אותיות חדשות וישנות ביחד!",onDone:()=>{setPhase(p,"done");showDone(p);}});
}
function showDone(p){
stopNarration();
stage.innerHTML="";renderHeader();
const c=el("div","card");
c.appendChild(el("div","done-emoji","🏆"));
c.appendChild(el("div","phase-title","כל הכבוד!"));
c.appendChild(el("div","phase-sub","סיימת את התרגול של היום. מחר יחכו לך אותיות חדשות! 🌈"));
const row=el("div","btn-row");const free=el("button","big btn-hear","🎲 תרגול חופשי");
free.onclick=()=>{const ids=shuffle(rangeArr(0,p.learned)).slice(0,Math.min(8,p.learned));quizFlow(p,ids,{title:"🎲 תרגול חופשי",sub:"סתם בשביל הכיף",onDone:()=>showDone(p)});};
row.appendChild(free);c.appendChild(row);stage.appendChild(c);confetti();
}
function quizFlow(p,items,opts){
let qi=0,mistakes=0;
function pool(excl){return shuffle(rangeArr(0,p.learned).filter(x=>x!==excl));}
function distract(i,n){
const L=LETTERS[i];
const all=pool(i).filter(x=>LETTERS[x][0]!==L[0]);
return all.slice(0,n);
}
function next(){
if(qi>=items.length){opts.onDone();return;}
const i=items[qi],L=LETTERS[i];
const kind=["find","pic","match"][Math.floor(Math.random()*3)];
const ds=distract(i,3);
stage.innerHTML="";
const c=el("div","card");
c.appendChild(el("div","progress-pips",items.map((_,j)=>j<qi?"🟣":(j===qi?"🟡":"⚪")).join(" ")));
c.appendChild(el("div","phase-title",opts.title));
c.appendChild(el("div","phase-sub",opts.sub));
let promptSay;
if(kind==="find"){
c.appendChild(el("div","letter-name","איפה האות "+L[1]+"?"));
promptSay=()=>sayLetterWithText(i,"איפה היא?");
}else if(kind==="pic"){
c.appendChild(el("div","prompt-emoji",L[3]));
c.appendChild(el("div","letter-name",L[4]==="end"?"באיזו אות נגמרת המילה "+L[2]+"?":"באיזו אות מתחילה המילה "+L[2]+"?"));
promptSay=()=>say(L[4]==="end"?"באיזו אות נגמרת המילה "+L[2]+"?":"באיזו אות מתחילה המילה "+L[2]+"?");
}else{
c.appendChild(el("div","big-letter",L[0]));
c.appendChild(el("div","letter-name",L[1]));
c.appendChild(el("div","phase-sub",L[4]==="end"?"איזו מילה נגמרת באות הזאת?":"איזו מילה מתחילה באות הזאת?"));
promptSay=()=>sayLetterWithText(i,L[4]==="end"?"איזו מילה נגמרת באות הזאת?":"איזו מילה מתחילה באות הזאת?");
}
const grid=el("div","opts");
const choices=shuffle([i].concat(ds));
let answered=false;
choices.forEach(ci=>{
const M=LETTERS[ci];
const b=el("button","opt "+(kind==="match"?"pic":"letter"),kind==="match"?M[3]+"<small>"+M[2]+"</small>":M[0]);
b.onclick=()=>{
if(answered)return;
if(ci===i){
answered=true;b.classList.add("right");fb.textContent=praise();fb.className="feedback good";confetti();
if(mistakes===0||true){p.stars++;saveAll();renderHeader();}
sayLetterWithText(i,kind==="match"?L[2]:"",()=>{guardedTransition(()=>{qi++;mistakes=0;next();},300);});
}else{
mistakes++;b.classList.add("wrong");fb.textContent=tryMsg();fb.className="feedback try";
if(kind==="match")say(M[2]);else sayLetter(ci);
}
};
grid.appendChild(b);
});
c.appendChild(grid);
const fb=el("div","feedback");c.appendChild(fb);
const row=el("div","btn-row");const h=el("button","big btn-hear","🔊 שמעי שוב");h.onclick=promptSay;row.appendChild(h);c.appendChild(row);
stage.appendChild(c);
promptSay();
}
next();
}
function wordPool(p){const d=difficulty(p);return WORDS.map((v,i)=>i).filter(i=>{const n=[...WORDS[i][0]].length;return d===0?n===2:d===1?n===3:n>=4;});}
function pickWord(){const pool=wordPool(currentProfile()),other=pool.filter(i=>i!==lastWord);const choices=other.length?other:pool;const w=choices[Math.floor(Math.random()*choices.length)];lastWord=w;return w;}
function runWordGame(p){
if(!p)return;
viewId++;puzzleMode=false;wordMode=true;mazeMode=false;
wordStep(p,pickWord(),0);
}
function wordStep(p,w,pos){

const word=WORDS[w][0],chars=[...word];

const picture=el("div","prompt-emoji");picture.appendChild(wordPicture(w));c.appendChild(picture);
const tiles=el("div","tiles");
chars.forEach((ch,k)=>tiles.appendChild(el("span","tile"+(k<pos?"":" hidden-l"),k<pos?ch:"?")));

const correct=chars[pos],correctIdx=CHAR_IDX[correct];
const dis=shuffle(rangeArr(0,LETTERS.length).filter(x=>LETTERS[x][0]!==correct)).slice(0,3);
const choices=shuffle([correctIdx].concat(dis));
const fb=el("div","feedback");
let answered=false;
const grid=el("div","opts");
choices.forEach(ci=>{
const b=el("button","opt letter",LETTERS[ci][0]);
b.onclick=()=>{
if(answered)return;
if(ci===correctIdx){
answered=true;b.classList.add("right");fb.textContent="יפה! 🌟";fb.className="feedback good";
if(pos+1>=chars.length){completeWord(p,w);return;}
sayLetterWithText(ci,"יפה! מה האות הבאה?",()=>{guardedTransition(()=>wordStep(p,w,pos+1),300);});
}else{
b.classList.add("wrong");fb.textContent=tryMsg();fb.className="feedback try";
sayLetter(ci);
}
};
grid.appendChild(b);
});
c.appendChild(grid);c.appendChild(fb);
const row=el("div","btn-row");
const hear=el("button","big btn-hear","שמעי את המילה");hear.onclick=()=>sayWord(w);row.appendChild(hear);
c.appendChild(row);
stage.appendChild(c);
sayWord(w,()=>say(pos===0?"שמעת? מה האות הראשונה במילה?":"ומה האות הבאה?"));
}

function puzzleArt(letter,cols=2,rows=2){
const raw=document.createElement("canvas");raw.width=raw.height=320;
const ctx=raw.getContext("2d",{willReadFrequently:true});
ctx.fillStyle="#8b5cf6";ctx.font="bold 250px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
ctx.fillText(letter,160,160);
const pixels=ctx.getImageData(0,0,320,320).data;
let x0=320,y0=320,x1=0,y1=0;
for(let y=0;y<320;y++)for(let x=0;x<320;x++)if(pixels[(y*320+x)*4+3]>30){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
const canvas=document.createElement("canvas");canvas.width=canvas.height=240;
const c=canvas.getContext("2d",{willReadFrequently:true});
const scale=208/Math.max(x1-x0+1,y1-y0+1),w=(x1-x0+1)*scale,h=(y1-y0+1)*scale;
c.drawImage(raw,x0,y0,x1-x0+1,y1-y0+1,(240-w)/2,(240-h)/2,w,h);
return rangeArr(0,cols*rows).map(k=>{
const tile=document.createElement("canvas");tile.width=240/cols;tile.height=240/rows;
const t=tile.getContext("2d",{willReadFrequently:true});t.drawImage(canvas,(k%cols)*tile.width,Math.floor(k/cols)*tile.height,tile.width,tile.height,0,0,tile.width,tile.height);
const d=t.getImageData(0,0,tile.width,tile.height).data;let ink=0;for(let i=3;i<d.length;i+=4)if(d[i]>30)ink++;
return {src:tile.toDataURL(),ink:ink>10};
});
}
function runPuzzle(p){
if(!p)return;
viewId++;stopNarration();puzzleMode=true;wordMode=false;mazeMode=false;renderHeader();
const pool=rangeArr(0,p.learned).filter(i=>i!==lastPuzzle);
const i=pool[Math.floor(Math.random()*pool.length)]??0;lastPuzzle=i;
const config=DIFFICULTIES[difficulty(p)],cols=config.cols,rows=config.rows,total=cols*rows;
const art=puzzleArt(LETTERS[i][0],cols,rows);
const fixed=new Set(art.map((v,k)=>!v.ink?k:-1).filter(k=>k>=0));
const slots=art.map((v,k)=>fixed.has(k)?k:null),needed=total-fixed.size;
let selected=null,done=false,ignoreClick=false,drag=null;
stage.innerHTML="";
const c=el("section","card puzzle-card"+(cols>2?" puzzle-dense":""));c.setAttribute("aria-label","פאזל להרכבת אות");
c.appendChild(el("div","phase-title","מרכיבים אות"));
c.appendChild(el("div","puzzle-hint","גררי את החלקים למקומם. בסוף נבדוק, ותוכלי לתקן"));
if(!config.guide)c.appendChild(el("div","puzzle-reference",LETTERS[i][0]));
const progress=el("div","puzzle-progress");c.appendChild(progress);
const board=el("div","puzzle-board"),bank=el("div","puzzle-pieces");
[board,bank].forEach(v=>v.style.gridTemplateColumns="repeat("+cols+",1fr)");
const feedback=el("div","feedback");feedback.setAttribute("aria-live","polite");
const cells=[],pieces=[],order=shuffle(rangeArr(0,total).filter(k=>!fixed.has(k)));
function clearSelection(){selected=null;[...cells,...pieces].forEach(v=>{if(v){v.classList.remove("selected");v.setAttribute("aria-pressed","false");}});}
function locate(k){return slots.indexOf(k);}
function paint(){
cells.forEach((b,k)=>{
const piece=slots[k];b.classList.toggle("placed",piece!==null);b.classList.remove("needs-fix");
b.firstChild.src=art[piece===null?k:piece].src;
b.setAttribute("aria-label","מקום בשורה "+(Math.floor(k/cols)+1)+", טור "+(k%cols+1)+(piece===null?", ריק":", חלק "+(piece+1)));
});
pieces.forEach((b,k)=>{if(b){b.disabled=locate(k)!==-1;}});
progress.textContent=slots.filter((v,k)=>v!==null&&!fixed.has(k)).length+" מתוך "+needed+" חלקים";
bank.style.display=slots.every(v=>v!==null)?"none":"grid";
}
function evaluate(){
if(done)return;
if(slots.some(v=>v===null)){feedback.textContent="עוד לא כל החלקים במקומם";feedback.className="feedback";return;}
if(slots.every((v,k)=>v===k)){done=true;clearSelection();completePuzzle(p,i,c);return;}
feedback.textContent="צריך לתקן קצת. החליפי בין החלקים ונסי שוב";feedback.className="feedback try";
say("צריך לתקן קצת. אפשר לגרור חלק למקום אחר ולהחליף בין החלקים.");
}
function place(k){
if(done||fixed.has(k)||selected===null)return;
const src=locate(selected),other=slots[k];
if(src===k){clearSelection();return;}
slots[k]=selected;if(src!==-1)slots[src]=other;
clearSelection();paint();feedback.textContent="";feedback.className="feedback";
if(slots.every(v=>v!==null))evaluate();
}
const cellAt=(x,y)=>cells.findIndex(b=>{const r=b.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;});
function choose(k,b){clearSelection();selected=k;b.classList.add("selected");b.setAttribute("aria-pressed","true");}
function bind(b,getPiece,onTap){
b.addEventListener("pointerdown",e=>{
if(done||e.isPrimary===false||(e.pointerType==="mouse"&&e.button!==0))return;
const k=getPiece();if(k===null||k===undefined)return;
ignoreClick=false;drag={k:k,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,ghost:null};
try{b.setPointerCapture(e.pointerId);}catch(_){}
});
b.addEventListener("pointermove",e=>{
if(!drag||e.pointerId!==drag.id||done)return;
if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
if(!drag.moved){
drag.moved=true;choose(drag.k,b);const r=b.getBoundingClientRect(),g=el("div","puzzle-ghost");
g.style.width=r.width+"px";g.style.height=r.height+"px";g.setAttribute("aria-hidden","true");
const img=new Image();img.src=art[drag.k].src;g.appendChild(img);c.appendChild(g);drag.ghost=g;
}
drag.ghost.style.left=(e.clientX-drag.ghost.offsetWidth/2)+"px";drag.ghost.style.top=(e.clientY-drag.ghost.offsetHeight/2)+"px";
const target=cellAt(e.clientX,e.clientY);cells.forEach((v,j)=>v.classList.toggle("drop-hint",j===target&&!fixed.has(j)));
});
const end=(e,cancel)=>{
if(!drag||e.pointerId!==drag.id)return;
const wasMoved=drag.moved;if(drag.ghost)drag.ghost.remove();drag=null;
cells.forEach(v=>v.classList.remove("drop-hint"));
if(wasMoved){ignoreClick=true;if(!cancel){const target=cellAt(e.clientX,e.clientY);if(target>=0)place(target);}else clearSelection();}
};
b.addEventListener("pointerup",e=>end(e,false));b.addEventListener("pointercancel",e=>end(e,true));
b.onclick=()=>{if(ignoreClick){ignoreClick=false;return;}if(!done)onTap();};
}
art.forEach((v,k)=>{
const b=el("button","puzzle-cell"+(!config.guide?" no-guide":""));b.type="button";b.style.aspectRatio=rows+" / "+cols;b.style.touchAction="none";
const img=new Image();img.src=v.src;img.alt="";b.appendChild(img);b.disabled=fixed.has(k);cells[k]=b;
bind(b,()=>fixed.has(k)?null:slots[k],()=>{if(selected!==null)place(k);else if(slots[k]!==null)choose(slots[k],b);else feedback.textContent="בחרי חלק למטה";});
board.appendChild(b);
});
order.forEach(k=>{
const b=el("button","puzzle-piece");b.type="button";b.style.aspectRatio=rows+" / "+cols;b.setAttribute("aria-label","חלק "+(k+1));
const img=new Image();img.src=art[k].src;img.alt="";b.appendChild(img);pieces[k]=b;
bind(b,()=>locate(k)===-1?k:null,()=>{choose(k,b);feedback.textContent="עכשיו בחרי מקום בלוח";});bank.appendChild(b);
});
c.appendChild(board);c.appendChild(bank);c.appendChild(feedback);
const row=el("div","btn-row"),check=el("button","big btn-hear","בדיקת הפאזל"),next=el("button","big btn-next","פאזל הבא");
check.onclick=evaluate;next.onclick=()=>runPuzzle(p);row.appendChild(check);row.appendChild(next);c.appendChild(row);
const hear=el("button","big btn-hear","איך משחקים?");hear.onclick=()=>say("גררי חלקים ללוח. אפשר גם ללחוץ על חלק ואז על מקום. בסוף נבדוק. כדי לתקן, גררי חלק על חלק אחר והם יתחלפו. פאזל הבא זמין גם בלי לסיים.");c.appendChild(hear);stage.appendChild(c);paint();
}
function completePuzzle(p,i,c){
p.stars++;saveAll();renderHeader();confetti();
c.querySelector(".puzzle-hint").textContent="כל הכבוד! הרכבת את האות "+LETTERS[i][1]+"!";
c.querySelector(".phase-title").textContent="כל הכבוד!";
c.querySelector(".puzzle-pieces").remove();c.querySelector(".feedback").remove();c.querySelectorAll(".btn-row,.btn-hear").forEach(v=>v.remove());
const dog=document.createElement("img");dog.className="puzzle-reward";dog.src=PUZZLE_DOG;dog.alt="הכלבה מעודדת אותך";c.appendChild(dog);
const row=el("div","btn-row"),more=el("button","big btn-next","עוד פאזל");more.onclick=()=>runPuzzle(p);row.appendChild(more);c.appendChild(row);
sayLetterWithText(i,"כל הכבוד! הרכבת את האות!");
}
const MAZE_LEVELS=[{size:5,exits:2},{size:7,exits:3},{size:9,exits:4}];
let lastMazeWord=-1;
function mazeWordPool(p){return wordPool(p).filter(w=>{const first=[...WORDS[w][0]][0];const li=LETTERS.findIndex(L=>L[0]===first);return li>=0&&li<p.learned;});}
function buildMaze(n){
const walls=[];for(let y=0;y<n;y++){walls[y]=[];for(let x=0;x<n;x++)walls[y][x]={t:1,r:1,b:1,l:1};}
const seen=new Set(["0,0"]),stack=[[0,0]];
while(stack.length){
const top=stack[stack.length-1],x=top[0],y=top[1],opts=[];
if(y>0&&!seen.has(x+","+(y-1)))opts.push([x,y-1,"t","b"]);
if(x<n-1&&!seen.has((x+1)+","+y))opts.push([x+1,y,"r","l"]);
if(y<n-1&&!seen.has(x+","+(y+1)))opts.push([x,y+1,"b","t"]);
if(x>0&&!seen.has((x-1)+","+y))opts.push([x-1,y,"l","r"]);
if(!opts.length){stack.pop();continue;}
const o=opts[Math.floor(Math.random()*opts.length)];
walls[y][x][o[2]]=0;walls[o[1]][o[0]][o[3]]=0;seen.add(o[0]+","+o[1]);stack.push([o[0],o[1]]);
}
return walls;
}
function pickExits(n,count,walls){
const deg=(x,y)=>{let d=0;const wc=walls[y][x];
if(y>0&&!wc.t)d++;if(x<n-1&&!wc.r)d++;if(y<n-1&&!wc.b)d++;if(x>0&&!wc.l)d++;return d;};
const byEdge=[
rangeArr(1,n).map(x=>[x,0,"t"]),
rangeArr(0,n).map(x=>[x,n-1,"b"]),
rangeArr(1,n-1).map(y=>[0,y,"l"]),
rangeArr(1,n-1).map(y=>[n-1,y,"r"])
].map(list=>shuffle(list.filter(e=>deg(e[0],e[1])===1)));
const out=[];let gi=0;
while(out.length<count&&byEdge.some(e=>e.length)){const e=byEdge[gi%byEdge.length];gi++;if(e.length)out.push(e.pop());}
return out;
}
function runMaze(p){
if(!p)return;
viewId++;stopNarration();mazeMode=true;wordMode=false;puzzleMode=false;renderHeader();
const level=MAZE_LEVELS[difficulty(p)],n=level.size;
const pool=mazeWordPool(p);if(!pool.length){stage.innerHTML="";return;}
const fresh=pool.filter(w=>w!==lastMazeWord),choices=fresh.length?fresh:pool;
const w=choices[Math.floor(Math.random()*choices.length)];lastMazeWord=w;
const word=WORDS[w][0],first=[...word][0];
const li=LETTERS.findIndex(L=>L[0]===first);
const others=shuffle(rangeArr(0,Math.min(p.learned,LETTERS.length)).filter(j=>j!==li));
LETTERS.forEach((L,j)=>{if(others.length<level.exits-1&&j!==li&&j>=p.learned)others.push(j);});
const letterIdxs=shuffle([li,...others.slice(0,level.exits-1)]);
let walls=buildMaze(n),exitCells=pickExits(n,level.exits,walls);
for(let tries=0;tries<20&&exitCells.length<level.exits;tries++){walls=buildMaze(n);exitCells=pickExits(n,level.exits,walls);}
const exits=exitCells.map((e,j)=>({x:e[0],y:e[1],side:e[2],letter:letterIdxs[j]}));
const start={x:0,y:0};
stage.innerHTML="";
const c=el("section","card puzzle-card");c.setAttribute("aria-label","מבוך אותיות");
c.appendChild(el("div","phase-title","מבוך האותיות"));
c.appendChild(el("div","puzzle-hint","עברי עם האצבע במבוך עד האות שפותחת את המילה"));
const picture=el("div","prompt-emoji");picture.appendChild(wordPicture(w));c.appendChild(picture);
c.appendChild(el("div","maze-word",word));
const wrap=el("div","maze-wrap");
const canvas=document.createElement("canvas");canvas.className="maze-canvas";canvas.setAttribute("aria-label","מבוך: התחילי מהעיגול הירוק ועברי לאות הראשונה במילה");
wrap.appendChild(canvas);c.appendChild(wrap);
const feedback=el("div","feedback");feedback.setAttribute("aria-live","polite");c.appendChild(feedback);
const row=el("div","btn-row"),hear=el("button","big btn-hear","איך משחקים?");
hear.onclick=()=>sayWord(w,()=>say("עברי עם האצבע מהעיגול הירוק, דרך המבוך, עד לאות שפותחת את המילה. שימי לב לפתחים בדופן המבוך."));
row.appendChild(hear);
const hearWord=el("button","big btn-hear","שמעי את המילה");hearWord.onclick=()=>sayWord(w);row.appendChild(hearWord);
c.appendChild(row);stage.appendChild(c);
const dpr=window.devicePixelRatio||1;
const ctx=canvas.getContext("2d");
let cssSize=340,cs=1;
let path=[start],tracing=false,done=false,finger=null,lastPt=null,wrongFlash=null;
const isExitSide=(x,y,side)=>exits.some(e=>e.x===x&&e.y===y&&e.side===side);
function draw(){
ctx.clearRect(0,0,cssSize,cssSize);
ctx.fillStyle="#ffffff";ctx.fillRect(0,0,cssSize,cssSize);
exits.forEach(e=>{
const X=e.x*cs,Y=e.y*cs;
ctx.fillStyle="#f1eaff";ctx.fillRect(X+1.5,Y+1.5,cs-3,cs-3);
ctx.fillStyle="#8b5cf6";ctx.font="bold "+(cs*0.55)+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
ctx.fillText(LETTERS[e.letter][0],X+cs/2,Y+cs/2+1);
});
ctx.strokeStyle="#7c6aa8";ctx.lineWidth=3;ctx.lineCap="round";
ctx.beginPath();
for(let y=0;y<n;y++)for(let x=0;x<n;x++){
const wc=walls[y][x],X=x*cs,Y=y*cs;
if(wc.t&&!(y===0&&isExitSide(x,y,"t"))){ctx.moveTo(X,Y);ctx.lineTo(X+cs,Y);}
if(wc.l&&!(x===0&&isExitSide(x,y,"l"))){ctx.moveTo(X,Y);ctx.lineTo(X,Y+cs);}
if(y===n-1&&wc.b&&!isExitSide(x,y,"b")){ctx.moveTo(X,Y+cs);ctx.lineTo(X+cs,Y+cs);}
if(x===n-1&&wc.r&&!isExitSide(x,y,"r")){ctx.moveTo(X+cs,Y);ctx.lineTo(X+cs,Y+cs);}
}
ctx.stroke();
if(path.length){
ctx.strokeStyle="#34c98e";ctx.lineWidth=cs*0.32;ctx.lineCap="round";ctx.lineJoin="round";
ctx.beginPath();ctx.moveTo(path[0].x*cs+cs/2,path[0].y*cs+cs/2);
path.forEach(pc=>ctx.lineTo(pc.x*cs+cs/2,pc.y*cs+cs/2));
ctx.stroke();
}
ctx.fillStyle="#34c98e";ctx.beginPath();ctx.arc(cs/2,cs/2,cs*0.3,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#ffffff";ctx.font="bold "+(cs*0.32)+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("▶",cs/2,cs/2+1);
if(wrongFlash&&Date.now()<wrongFlash.until){
ctx.strokeStyle="#f87171";ctx.lineWidth=4;ctx.strokeRect(wrongFlash.x*cs+2,wrongFlash.y*cs+2,cs-4,cs-4);
}
}
const posOf=e=>{const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
const cellOf=pt=>({x:Math.floor(pt.x/cs),y:Math.floor(pt.y/cs)});
const inGrid=cl=>cl.x>=0&&cl.x<n&&cl.y>=0&&cl.y<n;
const exitAt=cl=>exits.find(e=>e.x===cl.x&&e.y===cl.y)||null;
function openBetween(x,y,nx,ny){
if(nx===x&&ny===y-1)return !walls[y][x].t;
if(nx===x+1&&ny===y)return !walls[y][x].r;
if(nx===x&&ny===y+1)return !walls[y][x].b;
if(nx===x-1&&ny===y)return !walls[y][x].l;
return false;
}
function finishExit(ex){
tracing=false;
if(ex.letter===li){done=true;finger=null;draw();completeMaze(p,w,li,c);return;}
wrongFlash={x:ex.x,y:ex.y,until:Date.now()+700};
path=[start];finger=null;draw();setTimeout(draw,750);
feedback.textContent="כמעט! המילה "+word+" מתחילה באות אחרת. נסי שוב";feedback.className="feedback try";
say("כמעט! זו לא האות הראשונה במילה. נסי שוב.");
}
function advanceTo(pt){
const from=lastPt||pt,dist=Math.hypot(pt.x-from.x,pt.y-from.y);
const steps=Math.max(1,Math.ceil(dist/(cs/3)));
for(let s=1;s<=steps;s++){
const smp={x:from.x+(pt.x-from.x)*s/steps,y:from.y+(pt.y-from.y)*s/steps};
const cl=cellOf(smp);if(!inGrid(cl)){lastPt=smp;continue;}
const head=path[path.length-1];
if(cl.x===head.x&&cl.y===head.y){lastPt=smp;continue;}
if(path.length>1&&cl.x===path[path.length-2].x&&cl.y===path[path.length-2].y){path.pop();lastPt=smp;continue;}
if(openBetween(head.x,head.y,cl.x,cl.y)){
path.push(cl);lastPt=smp;
const ex=exitAt(cl);
if(ex){finishExit(ex);return;}
}else{lastPt={x:head.x*cs+cs/2,y:head.y*cs+cs/2};return;}
}
lastPt=pt;
}
canvas.addEventListener("pointerdown",e=>{
if(done)return;
const pt=posOf(e),cl=cellOf(pt),head=path[path.length-1];
if(cl.x===head.x&&cl.y===head.y){tracing=true;lastPt=pt;finger=pt;}
else if(cl.x===0&&cl.y===0){path=[start];tracing=true;lastPt=pt;finger=pt;draw();}
else{feedback.textContent="התחילי מהעיגול הירוק";feedback.className="feedback";return;}
try{canvas.setPointerCapture(e.pointerId);}catch(_){}
});
canvas.addEventListener("pointermove",e=>{
if(!tracing||done)return;
finger=posOf(e);advanceTo(finger);draw();
});
const stopTrace=()=>{tracing=false;finger=null;draw();};
canvas.addEventListener("pointerup",stopTrace);
canvas.addEventListener("pointercancel",stopTrace);
function sizeCanvas(){
if(!canvas.isConnected){window.removeEventListener("resize",sizeCanvas);return;}
cssSize=Math.min(wrap.clientWidth||340,340);cs=cssSize/n;
canvas.style.width=cssSize+"px";canvas.style.height=cssSize+"px";
canvas.width=Math.round(cssSize*dpr);canvas.height=Math.round(cssSize*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);
draw();
}
window.addEventListener("resize",sizeCanvas);
window.__mazeDebug={n:n,walls:walls,start:start,exits:exits,li:li,w:w,word:word,canvas:canvas,get cellSize(){return cs;},get path(){return path;},get done(){return done;}};
sizeCanvas();
sayWord(w,()=>say("מה האות הראשונה במילה? עברי אליה במבוך."));
}
function completeMaze(p,w,li,c){
p.stars++;saveAll();renderHeader();confetti();
c.innerHTML="";
c.appendChild(el("div","phase-title","כל הכבוד!"));
c.appendChild(el("div","puzzle-hint","הגעת לאות "+LETTERS[li][0]+", האות שפותחת את המילה "+WORDS[w][0]+"!"));
const row=el("div","btn-row"),more=el("button","big btn-next","עוד מבוך");more.onclick=()=>runMaze(p);row.appendChild(more);c.appendChild(row);
sayLetterWithText(li,"כל הכבוד! פתרת את המבוך!");
}
function changeDifficulty(delta){
const p=currentProfile();if(!p)return;const old=difficulty(p),next=Math.max(0,Math.min(2,old+delta));if(old===next)return;
viewId++;stopNarration();p.gameDifficulty=next;saveAll();
if(puzzleMode)runPuzzle(p);else if(wordMode)runWordGame(p);else if(mazeMode)runMaze(p);else renderHeader();
}
document.getElementById("harder").onclick=()=>changeDifficulty(1);
document.getElementById("easier").onclick=()=>changeDifficulty(-1);
document.getElementById("modePuzzle").onclick=()=>runPuzzle(currentProfile());
document.getElementById("modeMaze").onclick=()=>runMaze(currentProfile());
document.getElementById("modeWords").onclick=()=>{const p=currentProfile();if(p)runWordGame(p);};
document.getElementById("modeLetters").onclick=()=>{wordMode=false;startSession();};
document.getElementById("addOne").onclick=()=>{
const p=currentProfile();if(!p)return;
if(p.learned>=LETTERS.length){alert("כל האותיות כבר נלמדו 🎉");return;}
p.introducedToday=[p.learned];p.learned++;p.session={phase:"learn"};saveAll();startSession();
};
document.getElementById("resetKid").onclick=()=>{
const p=currentProfile();if(!p)return;
if(confirm("להתחיל מחדש?")){DB.profiles[DB.current]=newProfile();saveAll();startSession();}
};
if(!DB.current||!DB.profiles[DB.current]){
const saved=Object.keys(DB.profiles);
DB.current=saved[0]||"child";
if(!DB.profiles[DB.current])DB.profiles[DB.current]=newProfile();
saveAll();
}
startSession();
</script>
