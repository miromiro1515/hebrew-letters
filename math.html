<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חשבון בקצב שלי</title><style>
:root{font-family:Arial,sans-serif;color:#302647;background:#f4f0fb}*{box-sizing:border-box}body{margin:0;padding:12px;background:linear-gradient(150deg,#faf3df,#e8f5ff);min-height:100dvh}main{max-width:540px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px}h1{font-size:23px;margin:0}a{color:#6240a4;font-weight:bold;font-size:15px}button,select{font:inherit;touch-action:manipulation}button{cursor:pointer;min-height:46px;border:0;border-radius:13px;font-weight:bold;padding:10px 14px;color:#44325f;background:#eee7fa}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #8c5ed2;outline-offset:3px}button:disabled{opacity:.45;cursor:default}select{width:100%;min-height:46px;border:1px solid #cfc2e6;border-radius:12px;padding:8px;background:white;color:inherit;margin:7px 0 10px}.card{background:white;border-radius:22px;padding:20px 16px;box-shadow:0 5px 22px #56417b12;text-align:center}.topline{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#67567f}.track{height:7px;background:#ede8f5;border-radius:8px;overflow:hidden;margin:10px 0 18px}.track span{display:block;background:#8b5ac9;height:100%;transition:width .2s}.tag{color:#79648e;font-size:15px}.question{font-size:42px;font-weight:bold;margin:18px 0 12px;line-height:1.35;unicode-bidi:isolate}.question.words{font-size:23px;line-height:1.6}.prompt{font-size:16px;margin:0 0 14px;color:#6a5a7b}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers button{background:#f1edf9;border:2px solid #e9e1f3;min-height:65px;font-size:28px;direction:ltr}.answers button.wrong{border-color:#d58232;background:#fff1df}.answers button.right{border-color:#269c70;background:#e2f7ec}.feedback{min-height:40px;margin:12px 0 5px;line-height:1.45;font-weight:bold;color:#226f54;font-size:18px}.feedback.retry{color:#9b5c16}.hint{font-size:16px;line-height:1.5;background:#fff7e5;padding:10px;border-radius:12px;margin-top:8px}.hint:empty{display:none}.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}.tools button{font-size:15px;min-height:44px;background:#f5f1fa}.difficulty{display:flex;gap:8px;margin-top:14px}.difficulty button{flex:1;background:white;border:1px solid #d8cbe9;font-size:16px}.level{text-align:center;font-size:13px;color:#79698d;margin:7px 0}.primary{background:#7950b9!important;color:white!important;min-width:150px}.celebrate{font-size:72px;color:#269c70;margin:8px auto}.endchoice{display:grid;gap:10px;margin-top:6px}.endchoice button{min-height:58px;font-size:19px}.endchoice .same{background:#2f8f9d!important}.choose{font-weight:bold;margin:14px 0 6px}.finish h2{font-size:26px}.finish p{font-size:18px;line-height:1.5}footer{text-align:center;font-size:12px;line-height:1.5;color:#7d718a;margin:18px 0 4px}[hidden]{display:none!important}@media(max-width:350px){body{padding:9px}.card{padding:16px 12px}.question{font-size:36px}.question.words{font-size:21px}h1{font-size:21px}.answers button{min-height:58px}}
.lp-back-bar{direction:ltr;display:flex;justify-content:flex-start;padding:10px 12px 0}.lp-back{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 18px 8px 12px;border-radius:999px;background:#fff;color:#5b3fd0;border:2px solid #d9d0fb;box-shadow:0 3px 10px rgba(91,63,208,.18);font:700 1.05rem/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-decoration:none;-webkit-tap-highlight-color:transparent}.lp-back:active{transform:scale(.97)}.lp-back-arrow{font-size:1.9rem;line-height:1;font-weight:700}.lp-back-text{direction:rtl}
</style><link rel="stylesheet" href="theme.css"></head><body><div class="lp-back-bar"><a class="lp-back" href="learning.html" aria-label="חזרה לבחירת מקצוע"><span class="lp-back-arrow" aria-hidden="true">←</span><span class="lp-back-text">חזרה לבחירת מקצוע</span></a></div><main><header><h1>חשבון בקצב שלי</h1></header><label for="topic">מה מתרגלים?</label><select id="topic"><option value="mixed">קצת מהכול</option><option value="add">חיבור וחיסור</option><option value="times">כפל וחילוק</option><option value="place">מבנה המספר</option><option value="story">שאלות מילוליות</option></select><section id="exercise" class="card"><div class="topline"><span id="progress"></span><span id="stars"></span></div><div class="track"><span id="bar"></span></div><div id="kind" class="tag"></div><div id="question" class="question"></div><p class="prompt">בוחרים את התשובה המתאימה</p><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><div id="hint" class="hint" aria-live="polite"></div><div class="tools"><button id="hintBtn">רמז</button><button id="hear">להקריא</button><button id="next" class="primary" hidden>התרגיל הבא</button></div></section><section id="finish" class="card finish" hidden><h2>כל הכבוד!</h2><div class="celebrate" aria-hidden="true">✓</div><p id="summary"></p><p class="choose">מה עושים עכשיו?</p><div class="endchoice"><button id="up" class="primary">⬆ עולים רמה</button><button id="again" class="primary same">↻ עוד פעם באותה רמה</button></div><p id="upnote" class="level"></p></section><div class="difficulty"><button id="easier">קשה מדי</button><button id="harder">קל מדי</button></div><p id="level" class="level"></p><footer>תרגול קצר לכיתה ג׳, לא מבחן ולא תוכנית לימודים מלאה.<br>הבחירה וההצלחות נשמרות רק בדפדפן הזה. <span id="visits"></span></footer></main><script>
'use strict';
const KEY='kids_math_v1', $=id=>document.getElementById(id), TOTAL=8;
const topics=['add','times','place','story'];
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{}
let state={levels:{add:2,times:2,place:2,story:2,...saved.levels},topic:topics.includes(saved.topic)||saved.topic==='mixed'?saved.topic:'mixed',stars:Number(saved.stars)||0,visits:(Number(saved.visits)||0)+1,rounds:(saved.rounds&&typeof saved.rounds==='object')?saved.rounds:{}};
for(const t of topics)state.levels[t]=Math.max(1,Math.min(5,Number(state.levels[t])||2));
function roundKey(){return state.topic==='mixed'?'mixed@'+topics.map(t=>state.levels[t]).join(''):state.topic+'@'+state.levels[state.topic]}
function atTop(){return state.topic==='mixed'?topics.every(t=>state.levels[t]===5):state.levels[state.topic]===5}
let levelT=0;function clearLevelT(){clearTimeout(levelT);levelT=0}
let count=0,correct=0,q=null,solved=false,seen=new Set(),autoT=0,keepSpeech=false;
function clearAuto(){clearTimeout(autoT);autoT=0}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}function pick(xs){return xs[rand(0,xs.length-1)]}function shuffle(xs){for(let i=xs.length-1;i>0;i--){const j=rand(0,i);[xs[i],xs[j]]=[xs[j],xs[i]]}return xs}
function generate(topic,level){
 let a,b,answer,text,hint,kind,word=false;
 if(topic==='add'){
  let max=[20,100,500,1000,5000][level-1];a=rand(level===1?2:10,max-1);b=rand(1,max-a||1);const sub=Math.random()<.5;if(sub){b=rand(1,a);answer=a-b;text=`${a} − ${b} = ?`;hint=level===1?'אפשר להתחיל מהמספר הראשון ולספור לאחור.':`אפשר לפרק את ${b} למאות, לעשרות וליחידות, ולחסר בשלבים.`}else{answer=a+b;text=`${a} + ${b} = ?`;hint='אפשר לחבר יחידות בנפרד ועשרות בנפרד, ואז לחבר את התוצאות.'}kind='חיבור וחיסור';
 }else if(topic==='times'){
 const factors=[[2,5,10],[2,3,4,5,10],[2,3,4,5,6,7,8,9,10],[2,3,4,5,6,7,8,9,10],[2,3,4,5,6,7,8,9,10]][level-1];a=pick(factors);b=rand(1,level===1?5:10);if(level>=4&&Math.random()<.4){b=rand(2,level===5?20:9)*10}const divide=Math.random()<.5;if(divide){answer=b;text=`${a*b} ÷ ${a} = ?`;hint=`איזה מספר כפול ${a} נותן ${a*b}?`}else{answer=a*b;text=`${a} × ${b} = ?`;hint=`חשבו על ${a} קבוצות. בכל קבוצה ${b}. אפשר לחבר את ${b} שוב ושוב.`}kind='כפל וחילוק';
 }else if(topic==='place'){
 const max=[99,999,9999,9999,9999][level-1];a=rand(level===1?10:100,max);const places=level===1?[10]:level===2?[10,100]:[10,100,1000];b=pick(places.filter(x=>x<=a));answer=Math.floor(a/b)%10;const name={10:'העשרות',100:'המאות',1000:'האלפים'}[b];text=`מהי ספרת ${name} במספר ${a}?`;hint=`סופרים מימין: יחידות, עשרות, מאות, אלפים. חפשו את מקום ${name}.`;if(level===4){answer=answer*b;text=`מהו הערך של ספרת ${name} במספר ${a}?`;hint=`מצאו את ספרת ${name}, וכפלו אותה ב־${b}.`}if(level===5){const th=rand(1,9),h=rand(0,9),te=rand(0,9),u=rand(0,9);answer=th*1000+h*100+te*10+u;text=`איזה מספר מורכב מ־${th} אלפים, ${h} מאות, ${te} עשרות ו־${u} יחידות?`;hint='אפשר לרשום כל חלק בנפרד, ואז לחבר את החלקים.'}kind='מבנה המספר';word=true;
 }else{
 const max=[10,20,60,300,900][level-1];a=level>=4?rand(level===4?5:10,level===4?30:90)*10:rand(level===1?4:6,max);b=rand(1,a-1);if(level===1)b=rand(1,Math.min(a-1,6));const sub=Math.random()<(level<=2?.7:.55);
 const take=['היו לך {a} תפוחים בסל. אכלת {b} תפוחים. כמה תפוחים נשארו לך?','היו לך {a} מדבקות בחוברת. הדבקת {b} מדבקות. כמה מדבקות נשארו לך?','היו לך {a} ממתקים. נתת {b} ממתקים לחבר. כמה ממתקים נשארו לך?','בצלחת היו {a} עוגיות. אכלו {b} עוגיות. כמה עוגיות נשארו בצלחת?','היו לך {a} בלונים. {b} בלונים התפוצצו. כמה בלונים נשארו?','היו לך {a} גולות. איבדת {b} גולות במשחק. כמה גולות נשארו לך?','על המדף היו {a} ספרים. לקחת {b} ספרים לקרוא. כמה ספרים נשארו על המדף?','בקופסה היו {a} צבעים. הוצאת {b} צבעים לציור. כמה צבעים נשארו בקופסה?'];
 const give=['היו לך {a} מדבקות. קיבלת במתנה עוד {b} מדבקות. כמה מדבקות יש לך עכשיו?','בספרייה היו {a} ספרים. הגיעו עוד {b} ספרים חדשים. כמה ספרים יש עכשיו בספרייה?','היו לך {a} גולות. זכית במשחק בעוד {b} גולות. כמה גולות יש לך עכשיו?','היו לך {a} תפוחים בסל. שמת עוד {b} תפוחים בסל. כמה תפוחים יש עכשיו בסל?','היו לך {a} עוגיות בצלחת. אפית עוד {b} עוגיות. כמה עוגיות יש עכשיו?'];
 if(sub){answer=a-b;text=pick(take);hint=level===1?'התחלנו עם כמות והורדנו ממנה. אפשר לספור לאחור מהמספר הראשון.':'הורידו חלק מהכמות, אז היא קטנה. אפשר לחסר קודם עשרות ואז יחידות.'}else{answer=a+b;text=pick(give);hint='הכמות גדלה. אפשר לחבר קודם עשרות ואז יחידות.'}
 text=text.replaceAll('{a}',a).replaceAll('{b}',b);kind='שאלה מילולית';word=true;
 }
 const candidates=new Set([answer]);if(topic==='place'&&level<=3){while(candidates.size<4)candidates.add(rand(0,9))}else{const distance=Math.max(3,Math.min(30,Math.ceil(answer/6)));while(candidates.size<4){const n=answer+rand(-distance,distance);if(n>=0)candidates.add(n)}}
 return {topic,level,a,b,answer,text,hint,kind,word,options:shuffle([...candidates])};
}
function speak(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.text.replace('−',' פחות ').replace('+',' ועוד ').replace('×',' כפול ').replace('÷',' לחלק ל ').replace('= ?',' שווה כמה?'));u.lang='he-IL';u.rate=.85;speechSynthesis.speak(u)}
function updateLevel(){const selected=state.topic;const l=selected==='mixed'?null:state.levels[selected];$('level').textContent=l?`רמה ${l} מתוך 5 · אפשר לשנות בכל רגע`:'רמה נפרדת לכל נושא · אפשר לשנות בכל רגע';$('easier').disabled=selected==='mixed'?topics.every(t=>state.levels[t]===1):l===1;$('harder').disabled=selected==='mixed'?topics.every(t=>state.levels[t]===5):l===5}
function newQuestion(){clearAuto();clearLevelT();if(!keepSpeech&&'speechSynthesis'in window)speechSynthesis.cancel();$('exercise').hidden=false;$('finish').hidden=true;solved=false;let t=state.topic==='mixed'?topics[count%topics.length]:state.topic;for(let i=0;i<20;i++){q=generate(t,state.levels[t]);if(!seen.has(q.text))break}seen.add(q.text);$('kind').textContent=q.kind;$('question').textContent=q.text;$('question').dir=q.word?'rtl':'ltr';$('question').className='question'+(q.word?' words':'');$('progress').textContent=`תרגיל ${count+1} מתוך ${TOTAL}`;$('stars').textContent=`${state.stars} הצלחות`;$('bar').style.width=(count/TOTAL*100)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('hint').textContent='';$('next').hidden=true;$('hintBtn').hidden=false;$('answers').replaceChildren();for(const n of q.options){const btn=document.createElement('button');btn.textContent=n;btn.setAttribute('aria-label',`תשובה ${n}`);btn.onclick=()=>answer(n,btn);$('answers').append(btn)}updateLevel()}
function answer(n,btn){if(solved)return;if(n!==q.answer){btn.classList.add('wrong');btn.disabled=true;$('feedback').textContent='כמעט! אפשר להיעזר ברמז ולנסות שוב.';$('feedback').className='feedback retry';return}solved=true;correct++;state.stars++;save();window.lpCelebrate&&lpCelebrate();btn.classList.add('right');for(const b of $('answers').children)b.disabled=true;$('feedback').textContent='נכון, כל הכבוד!';$('feedback').className='feedback';$('stars').textContent=`${state.stars} הצלחות`;$('next').textContent=count===TOTAL-1?'סיום הסיבוב':'התרגיל הבא';$('next').hidden=false;$('hintBtn').hidden=true;clearAuto();autoT=setTimeout(()=>{autoT=0;keepSpeech=true;try{$('next').click()}finally{keepSpeech=false}},1000)}
function change(delta){for(const t of state.topic==='mixed'?topics:[state.topic])state.levels[t]=Math.max(1,Math.min(5,state.levels[t]+delta));save();count=0;correct=0;seen.clear();newQuestion();$('hint').textContent=delta>0?'העלינו מעט את הרמה. מתחילים סיבוב חדש.':'הורדנו מעט את הרמה. מתחילים סיבוב חדש.'}
$('next').onclick=()=>{clearAuto();if(!solved)return;count++;if(count<TOTAL){newQuestion();return}if(!keepSpeech&&'speechSynthesis'in window)speechSynthesis.cancel();$('exercise').hidden=true;$('finish').hidden=false;$('summary').textContent=`סיימת ${TOTAL} תרגילים. צעד קטן של תרגול, הצלחה גדולה!`;const k=roundKey();state.rounds[k]=(state.rounds[k]||0)+1;save();const top=atTop();$('up').disabled=top;const n=state.rounds[k];
if(top){$('upnote').textContent='הגעת לרמה הגבוהה ביותר, אפשר לתרגל אותה שוב.'}
else if(n>=3){$('upnote').textContent='סיימת 3 סבבים ברמה הזאת! עוברים לרמה הבאה עוד רגע. אפשר גם לבחור בעצמך.';clearLevelT();levelT=setTimeout(()=>{levelT=0;if(!$('finish').hidden)$('up').click()},4000)}
else{$('upnote').textContent=`סבב ${n} מתוך 3 ברמה הזאת. אחרי 3 סבבים עולים רמה.`}
$('up').focus({preventScroll:true})};
$('again').onclick=()=>{clearLevelT();count=0;correct=0;seen.clear();newQuestion()};$('harder').onclick=()=>change(1);$('up').onclick=()=>{clearLevelT();change(1);$('hint').textContent='עלינו רמה. מתחילים סיבוב חדש!'};$('easier').onclick=()=>change(-1);$('hintBtn').onclick=()=>{$('hint').textContent=q.hint};$('hear').onclick=speak;$('hear').hidden=!('speechSynthesis'in window);$('topic').value=state.topic;$('topic').onchange=()=>{state.topic=$('topic').value;count=0;correct=0;seen.clear();save();newQuestion()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel()});window.addEventListener('pagehide',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});$('visits').textContent=`ביקורים בדפדפן הזה: ${state.visits}.`;save();newQuestion();
</script><script src="celebrate.js"></script></body></html>
